<!doctype html>
<html lang="zh-CN" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<meta name="description" content="星枢终端工作区界面设计：单层边界、连接栏、会话标签、终端画布与上下文面板。" />
		<title>星枢终端 · 终端工作区</title>
		<style>
			:root {
				color-scheme: light;
				--page: #eaedf7;
				--surface: #ffffff;
				--surface-soft: #f6f7fb;
				--surface-raised: #fbfbfe;
				--field: #f3f4f9;
				--ink: #17182b;
				--ink-soft: #43465b;
				--muted: #76798c;
				--line: rgba(28, 30, 58, 0.1);
				--line-strong: rgba(28, 30, 58, 0.17);
				--accent: #8b5cf6;
				--accent-strong: #7242dc;
				--accent-2: #d8679b;
				--accent-soft: rgba(139, 92, 246, 0.1);
				--accent-border: rgba(139, 92, 246, 0.24);
				--success: #16865a;
				--success-soft: rgba(22, 134, 90, 0.1);
				--warning: #a26c16;
				--warning-soft: rgba(185, 124, 25, 0.12);
				--danger: #c43f5a;
				--danger-soft: rgba(196, 63, 90, 0.1);
				--terminal: #111319;
				--terminal-raised: #151722;
				--terminal-line: rgba(255, 255, 255, 0.075);
				--terminal-ink: #d8d8e2;
				--terminal-muted: #7f8296;
				--terminal-green: #4fd39b;
				--terminal-cyan: #5bbcf7;
				--terminal-yellow: #e9c46a;
				--terminal-pink: #eb84ab;
				--terminal-purple: #b59aff;
				--nav-shadow: 0 18px 48px -34px rgba(24, 25, 64, 0.46), 0 4px 14px -10px rgba(24, 25, 64, 0.15);
				--shell-shadow: 0 34px 90px -58px rgba(29, 24, 76, 0.56);
			}

			html[data-theme='dark'] {
				color-scheme: dark;
				--page: #080910;
				--surface: #12131e;
				--surface-soft: #0f1018;
				--surface-raised: #181925;
				--field: #10111a;
				--ink: #f4f1ff;
				--ink-soft: #d4d0e3;
				--muted: #9293a7;
				--line: rgba(255, 255, 255, 0.09);
				--line-strong: rgba(255, 255, 255, 0.16);
				--accent: #a483ff;
				--accent-strong: #c0a9ff;
				--accent-2: #ef83af;
				--accent-soft: rgba(164, 131, 255, 0.13);
				--accent-border: rgba(164, 131, 255, 0.27);
				--success: #55d6a0;
				--success-soft: rgba(85, 214, 160, 0.1);
				--warning: #efbd68;
				--warning-soft: rgba(239, 189, 104, 0.11);
				--danger: #ff7f98;
				--danger-soft: rgba(255, 127, 152, 0.1);
				--terminal: #0b0c12;
				--terminal-raised: #12141d;
				--terminal-line: rgba(255, 255, 255, 0.07);
				--nav-shadow: 0 22px 56px -34px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.025);
				--shell-shadow: 0 38px 90px -52px rgba(0, 0, 0, 0.9);
			}

			* {
				box-sizing: border-box;
			}

			html {
				min-height: 100%;
				background: var(--page);
			}

			body {
				min-height: 100svh;
				margin: 0;
				color: var(--ink);
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC',
					'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
				background:
					radial-gradient(52rem 36rem at 8% -9%, rgba(115, 146, 255, 0.16), transparent 68%),
					radial-gradient(44rem 32rem at 100% 4%, rgba(218, 103, 155, 0.12), transparent 66%), var(--page);
				-webkit-font-smoothing: antialiased;
				text-rendering: optimizeLegibility;
			}

			body::before {
				position: fixed;
				inset: 0;
				z-index: -1;
				content: '';
				pointer-events: none;
				background-image:
					linear-gradient(rgba(255, 255, 255, 0.13) 1px, transparent 1px),
					linear-gradient(90deg, rgba(255, 255, 255, 0.13) 1px, transparent 1px);
				background-size: 52px 52px;
				mask-image: radial-gradient(circle at 48% 8%, black, transparent 72%);
				opacity: 0.26;
			}

			button,
			input {
				color: inherit;
				font: inherit;
			}

			button {
				padding: 0;
				cursor: pointer;
				background: none;
				border: 0;
			}

			a {
				color: inherit;
				text-decoration: none;
			}

			svg {
				display: block;
			}

			[hidden] {
				display: none !important;
			}

			:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}

			.sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				margin: -1px;
				padding: 0;
				white-space: nowrap;
				border: 0;
				clip: rect(0 0 0 0);
				clip-path: inset(50%);
			}

			.skip-link {
				position: fixed;
				top: 8px;
				left: 8px;
				z-index: 100;
				padding: 9px 13px;
				color: #fff;
				font-size: 12px;
				background: var(--accent-strong);
				border-radius: 9px;
				transform: translateY(-160%);
			}

			.skip-link:focus {
				transform: translateY(0);
			}

			.nav-shell {
				position: sticky;
				top: 0;
				z-index: 60;
				padding: 14px 20px 0;
			}

			.topbar {
				position: relative;
				display: flex;
				width: min(1560px, 100%);
				height: 68px;
				align-items: center;
				gap: 18px;
				margin-inline: auto;
				padding: 7px 9px 7px 12px;
				background: color-mix(in srgb, var(--surface) 89%, transparent);
				border: 1px solid var(--line-strong);
				border-radius: 21px;
				box-shadow: var(--nav-shadow);
				backdrop-filter: blur(22px) saturate(160%);
			}

			.brand {
				display: flex;
				flex: 0 0 auto;
				align-items: center;
				gap: 10px;
				border-radius: 13px;
			}

			.brand-mark {
				display: grid;
				width: 42px;
				height: 42px;
				flex: 0 0 auto;
				place-items: center;
				background: linear-gradient(145deg, #f0ebff, #f8f2fb);
				border: 1px solid var(--line-strong);
				border-radius: 13px;
			}

			html[data-theme='dark'] .brand-mark {
				background: linear-gradient(145deg, #1c1b2b, #161521);
			}

			.brand-mark svg {
				width: 29px;
				height: 29px;
			}

			.brand-copy strong,
			.brand-copy small {
				display: block;
			}

			.brand-copy strong {
				font-size: 14px;
				font-weight: 720;
				letter-spacing: 0.025em;
			}

			.brand-copy small {
				margin-top: 2px;
				color: var(--muted);
				font-size: 7px;
				font-weight: 680;
				letter-spacing: 0.15em;
			}

			.nav-frame {
				display: flex;
				min-width: 0;
				flex: 1;
				align-items: center;
				justify-content: center;
			}

			.main-nav {
				display: flex;
				align-items: center;
				gap: 3px;
			}

			.nav-item {
				display: inline-flex;
				height: 42px;
				align-items: center;
				gap: 7px;
				padding: 0 13px;
				color: var(--muted);
				font-size: 11px;
				font-weight: 580;
				border: 1px solid transparent;
				border-radius: 11px;
				transition:
					color 140ms ease,
					background 140ms ease,
					border-color 140ms ease;
			}

			.nav-item svg {
				width: 16px;
				height: 16px;
				flex: 0 0 auto;
			}

			.nav-item:hover {
				color: var(--ink);
				background: var(--field);
			}

			.nav-item[aria-current='page'] {
				color: var(--accent-strong);
				background: var(--accent-soft);
				border-color: var(--accent-border);
			}

			.tools {
				display: flex;
				flex: 0 0 auto;
				align-items: center;
				gap: 8px;
			}

			.tool-button,
			.mobile-trigger {
				display: grid;
				width: 40px;
				height: 40px;
				place-items: center;
				color: var(--muted);
				background: transparent;
				border: 1px solid transparent;
				border-radius: 11px;
			}

			.tool-button:hover,
			.mobile-trigger:hover {
				color: var(--ink);
				background: var(--field);
				border-color: var(--line);
			}

			.tool-button svg,
			.mobile-trigger svg {
				width: 17px;
				height: 17px;
			}

			.tool-button .icon-moon,
			html[data-theme='dark'] .tool-button .icon-sun {
				display: none;
			}

			html[data-theme='dark'] .tool-button .icon-moon {
				display: block;
			}

			.toolbar-line {
				width: 1px;
				height: 24px;
				background: var(--line);
			}

			.account-wrap {
				position: relative;
			}

			.account-button {
				display: flex;
				height: 42px;
				align-items: center;
				gap: 8px;
				padding: 4px 9px 4px 4px;
				color: var(--ink-soft);
				font-size: 11px;
				font-weight: 620;
				border: 1px solid transparent;
				border-radius: 12px;
			}

			.account-button:hover,
			.account-button[aria-expanded='true'] {
				background: var(--field);
				border-color: var(--line);
			}

			.avatar {
				display: grid;
				width: 32px;
				height: 32px;
				place-items: center;
				color: #fff;
				font-size: 12px;
				font-weight: 700;
				background: linear-gradient(145deg, #8b5cf6, #d8679b);
				border-radius: 10px;
			}

			.account-chevron {
				width: 13px;
				height: 13px;
				color: var(--muted);
			}

			.account-menu {
				position: absolute;
				top: calc(100% + 10px);
				right: 0;
				z-index: 80;
				width: 230px;
				padding: 7px;
				background: var(--surface);
				border: 1px solid var(--line-strong);
				border-radius: 14px;
				box-shadow: 0 24px 54px -28px rgba(20, 21, 50, 0.6);
			}

			.account-head {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 8px 9px 10px;
			}

			.account-head strong,
			.account-head span {
				display: block;
			}

			.account-head strong {
				font-size: 11px;
			}

			.account-head span span {
				margin-top: 2px;
				color: var(--muted);
				font-size: 8px;
			}

			.menu-link {
				display: flex;
				width: 100%;
				height: 36px;
				align-items: center;
				gap: 9px;
				padding: 0 9px;
				color: var(--ink-soft);
				font-size: 10px;
				text-align: left;
				border-radius: 9px;
			}

			.menu-link svg {
				width: 14px;
				height: 14px;
			}

			.menu-link:hover {
				background: var(--field);
			}

			.menu-link.danger {
				color: var(--danger);
			}

			.menu-separator {
				height: 1px;
				margin: 5px 4px;
				background: var(--line);
			}

			.mobile-trigger,
			.mobile-sheet {
				display: none;
			}

			.workspace-page {
				width: min(1560px, calc(100% - 32px));
				height: calc(100dvh - 108px);
				min-height: 620px;
				margin: 14px auto 18px;
			}

			.workspace-shell {
				position: relative;
				display: flex;
				height: 100%;
				min-height: 0;
				overflow: hidden;
				flex-direction: column;
				background: var(--surface);
				border: 1px solid var(--line-strong);
				border-radius: 23px;
				box-shadow: var(--shell-shadow);
			}

			.session-bar {
				display: flex;
				height: 48px;
				flex: 0 0 auto;
				align-items: stretch;
				background: color-mix(in srgb, var(--surface) 93%, transparent);
				border-bottom: 1px solid var(--line);
			}

			.session-tabs {
				display: flex;
				min-width: 0;
				flex: 1;
				align-items: stretch;
				overflow-x: auto;
				scrollbar-width: none;
			}

			.session-tabs::-webkit-scrollbar {
				display: none;
			}

			.session-tab {
				position: relative;
				display: flex;
				min-width: 150px;
				max-width: 220px;
				align-items: center;
				gap: 8px;
				padding: 0 10px 0 12px;
				color: var(--muted);
				font-size: 10.5px;
				border-right: 1px solid var(--line);
			}

			.session-tab::after {
				position: absolute;
				right: 10px;
				bottom: 0;
				left: 10px;
				height: 2px;
				content: '';
				background: var(--accent);
				border-radius: 99px 99px 0 0;
				opacity: 0;
			}

			.session-tab:hover {
				color: var(--ink);
				background: color-mix(in srgb, var(--field) 70%, transparent);
			}

			.session-tab[aria-selected='true'] {
				color: var(--ink);
				background: color-mix(in srgb, var(--accent-soft) 72%, transparent);
			}

			.session-tab[aria-selected='true']::after {
				opacity: 1;
			}

			.session-tab .state-dot {
				width: 7px;
				height: 7px;
				flex: 0 0 auto;
				background: var(--success);
				border-radius: 50%;
				box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 10%, transparent);
			}

			.session-tab .state-dot.warning {
				background: var(--warning);
				box-shadow: 0 0 0 4px color-mix(in srgb, var(--warning) 11%, transparent);
			}

			.session-tab .state-dot.muted {
				background: var(--muted);
				box-shadow: none;
			}

			.session-tab-name {
				overflow: hidden;
				flex: 1;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.tab-close {
				display: grid;
				width: 20px;
				height: 20px;
				flex: 0 0 auto;
				place-items: center;
				color: var(--muted);
				border-radius: 6px;
				opacity: 0;
			}

			.session-tab:hover .tab-close,
			.session-tab[aria-selected='true'] .tab-close {
				opacity: 1;
			}

			.tab-close:hover {
				color: var(--ink);
				background: var(--field);
			}

			.tab-close svg {
				width: 12px;
				height: 12px;
			}

			.session-bar-button {
				display: grid;
				width: 44px;
				flex: 0 0 auto;
				place-items: center;
				color: var(--muted);
				border-left: 1px solid var(--line);
			}

			.session-bar-button:hover {
				color: var(--ink);
				background: var(--field);
			}

			.session-bar-button svg {
				width: 16px;
				height: 16px;
			}

			.session-actions {
				display: flex;
				flex: 0 0 auto;
				align-items: stretch;
				border-left: 1px solid var(--line);
			}

			.progress-button {
				position: relative;
			}

			.progress-count {
				position: absolute;
				top: 7px;
				right: 7px;
				display: grid;
				min-width: 14px;
				height: 14px;
				place-items: center;
				padding: 0 3px;
				color: #fff;
				font-size: 7px;
				font-weight: 720;
				background: var(--accent-2);
				border-radius: 999px;
			}

			.session-menu-mobile {
				display: grid;
				width: 46px;
				flex: 0 0 auto;
				place-items: center;
				color: var(--muted);
				border-right: 1px solid var(--line);
			}

			.session-menu-mobile:hover {
				color: var(--ink);
				background: var(--field);
			}

			.session-menu-mobile svg {
				width: 17px;
				height: 17px;
			}

			.workspace-grid {
				display: grid;
				min-height: 0;
				flex: 1;
				grid-template-columns: minmax(0, 1fr);
				overflow: hidden;
			}

			.workspace-shell.context-hidden .workspace-grid {
				grid-template-columns: minmax(0, 1fr);
			}

			.connections-panel {
				position: absolute;
				top: 0;
				bottom: 0;
				left: 0;
				z-index: 42;
				display: flex;
				width: min(292px, 88vw);
				min-width: 0;
				min-height: 0;
				flex-direction: column;
				background: color-mix(in srgb, var(--surface-soft) 64%, var(--surface));
				border-right: 1px solid var(--line-strong);
				box-shadow: 22px 0 50px -38px rgba(0, 0, 0, 0.62);
				visibility: hidden;
				transform: translateX(-100%);
				transition:
					transform 180ms ease,
					visibility 180ms ease;
			}

			.workspace-shell.connections-open .connections-panel {
				visibility: visible;
				transform: translateX(0);
			}

			.panel-head {
				display: flex;
				height: 46px;
				flex: 0 0 auto;
				align-items: center;
				justify-content: space-between;
				gap: 10px;
				padding: 0 14px;
				border-bottom: 1px solid var(--line);
			}

			.panel-head-main {
				display: flex;
				min-width: 0;
				align-items: center;
				gap: 8px;
			}

			.panel-title-copy {
				display: flex;
				min-width: 0;
				flex-direction: column;
				gap: 2px;
			}

			.panel-title-copy .panel-count {
				overflow: hidden;
				font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.panel-head strong {
				font-size: 11.5px;
				font-weight: 680;
			}

			.panel-count {
				color: var(--muted);
				font-size: 8.5px;
				font-variant-numeric: tabular-nums;
			}

			.icon-button {
				display: grid;
				width: 30px;
				height: 30px;
				flex: 0 0 auto;
				place-items: center;
				color: var(--muted);
				border-radius: 8px;
			}

			.icon-button:hover {
				color: var(--ink);
				background: var(--field);
			}

			.icon-button svg {
				width: 15px;
				height: 15px;
			}

			.mobile-panel-close {
				display: grid;
			}

			.connection-search {
				position: relative;
				padding: 10px 12px;
			}

			.connection-search svg {
				position: absolute;
				top: 21px;
				left: 23px;
				width: 14px;
				height: 14px;
				color: var(--muted);
				pointer-events: none;
			}

			.connection-search input {
				width: 100%;
				height: 34px;
				padding: 0 10px 0 32px;
				color: var(--ink);
				font-size: 10px;
				background: var(--field);
				border: 1px solid transparent;
				border-radius: 9px;
				outline: none;
			}

			.connection-search input:focus {
				background: var(--surface);
				border-color: var(--accent-border);
				box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 9%, transparent);
			}

			.connection-search input::placeholder {
				color: var(--muted);
			}

			.connection-scroll {
				min-height: 0;
				flex: 1;
				overflow-y: auto;
				padding: 0 8px 10px;
				scrollbar-width: thin;
				scrollbar-color: var(--line-strong) transparent;
			}

			.connection-group + .connection-group {
				margin-top: 9px;
			}

			.connection-group-label {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 7px 8px 5px;
				color: var(--muted);
				font-size: 8px;
				font-weight: 720;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}

			.connection-group-label::after {
				height: 1px;
				flex: 1;
				content: '';
				background: linear-gradient(90deg, var(--line), transparent);
			}

			.connection-row {
				position: relative;
				display: flex;
				width: 100%;
				min-width: 0;
				align-items: center;
				gap: 9px;
				padding: 8px 9px;
				text-align: left;
				border-radius: 9px;
			}

			.connection-row::before {
				position: absolute;
				top: 10px;
				bottom: 10px;
				left: -8px;
				width: 2px;
				content: '';
				background: var(--accent);
				border-radius: 0 99px 99px 0;
				opacity: 0;
			}

			.connection-row:hover {
				background: var(--field);
			}

			.connection-row[aria-current='true'] {
				background: color-mix(in srgb, var(--accent-soft) 76%, var(--surface));
			}

			.connection-row[aria-current='true']::before {
				opacity: 1;
			}

			.connection-icon {
				display: grid;
				width: 30px;
				height: 30px;
				flex: 0 0 auto;
				place-items: center;
				color: var(--accent-strong);
				background: color-mix(in srgb, var(--accent-soft) 82%, transparent);
				border-radius: 8px;
			}

			.connection-icon.database {
				color: var(--warning);
				background: var(--warning-soft);
			}

			.connection-icon svg {
				width: 15px;
				height: 15px;
			}

			.connection-copy {
				min-width: 0;
				flex: 1;
			}

			.connection-copy strong,
			.connection-copy small {
				display: block;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.connection-copy strong {
				font-size: 10px;
				font-weight: 640;
			}

			.connection-copy small {
				margin-top: 2px;
				color: var(--muted);
				font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
				font-size: 8px;
			}

			.connection-state {
				width: 6px;
				height: 6px;
				flex: 0 0 auto;
				background: var(--success);
				border-radius: 50%;
			}

			.connection-state.warning {
				background: var(--warning);
			}

			.connection-state.muted {
				background: var(--muted);
			}

			.connections-footer {
				flex: 0 0 auto;
				padding: 8px 10px 10px;
				border-top: 1px solid var(--line);
			}

			.add-connection {
				display: flex;
				width: 100%;
				height: 34px;
				align-items: center;
				justify-content: center;
				gap: 7px;
				color: var(--accent-strong);
				font-size: 9px;
				font-weight: 640;
				background: color-mix(in srgb, var(--accent-soft) 58%, transparent);
				border-radius: 8px;
			}

			.add-connection:hover {
				background: color-mix(in srgb, var(--accent-soft) 90%, transparent);
			}

			.add-connection svg {
				width: 13px;
				height: 13px;
			}

			.terminal-stack {
				display: flex;
				min-width: 0;
				min-height: 0;
				flex-direction: column;
				overflow: hidden;
				background: var(--terminal);
			}

			.terminal-head {
				display: flex;
				height: 48px;
				flex: 0 0 auto;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				padding: 0 10px 0 14px;
				color: var(--terminal-ink);
				background: var(--terminal-raised);
				border-bottom: 1px solid var(--terminal-line);
			}

			.terminal-identity {
				display: flex;
				min-width: 0;
				align-items: center;
				gap: 9px;
			}

			.terminal-mark {
				display: grid;
				width: 26px;
				height: 26px;
				flex: 0 0 auto;
				place-items: center;
				color: var(--terminal-purple);
				background: rgba(181, 154, 255, 0.1);
				border-radius: 7px;
			}

			.terminal-mark svg {
				width: 15px;
				height: 15px;
			}

			.terminal-title {
				min-width: 0;
			}

			.terminal-title strong,
			.terminal-title small {
				display: block;
			}

			.terminal-title strong {
				overflow: hidden;
				font-size: 10.5px;
				font-weight: 680;
				letter-spacing: 0.01em;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.terminal-title small {
				overflow: hidden;
				margin-top: 2px;
				color: var(--terminal-muted);
				font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
				font-size: 8px;
				text-overflow: ellipsis;
				white-space: nowrap;

			.terminal-actions {
				display: flex;
				flex: 0 0 auto;
				align-items: center;
				gap: 2px;

				width: 32px;
				height: 32px;
				place-items: center;
				color: var(--terminal-muted);
				border-radius: 7px;

			.terminal-icon-button:hover {
				color: var(--terminal-ink);
				background: rgba(255, 255, 255, 0.065);
			}

			.terminal-icon-button svg {
				width: 15px;
				height: 15px;
			}

			.terminal-stage {
				min-height: 0;

				padding: 16px 20px 14px;

				scrollbar-color: rgba(255, 255, 255, 0.14) transparent;

			.terminal-lines {
				margin: 0;
				color: var(--terminal-ink);
				font-family:

				font-size: clamp(11px, 0.82vw, 12.5px);
				line-height: 1.68;
				overflow-wrap: anywhere;
				tab-size: 4;
			}

			.term-line {
				min-height: 1.68em;
				white-space: pre-wrap;
			}

			.term-muted {
				color: var(--terminal-muted);
			}

			.term-green {
				color: var(--terminal-green);
			}

			.term-cyan {
				color: var(--terminal-cyan);
			}

			.term-yellow {
				color: var(--terminal-yellow);
			}

			.term-pink {
				color: var(--terminal-pink);
			}

			.term-purple {
				color: var(--terminal-purple);
			}

			.term-prompt {
				color: var(--terminal-green);
				font-weight: 650;
			}

			.term-path {
				color: var(--terminal-cyan);
			}

			.term-cursor {
				display: inline-block;
				width: 7px;
				height: 1.08em;
				margin-left: 1px;
				vertical-align: -0.16em;
				background: var(--terminal-ink);
				animation: cursor-blink 1.05s steps(1) infinite;
			}

			@keyframes cursor-blink {
				0%,
				52% {
					opacity: 1;
				}
				53%,
				100% {
					opacity: 0;
				}
			}

			.command-row {
				display: flex;
				min-height: 52px;
				flex: 0 0 auto;
				align-items: center;
				gap: 8px;
				padding: 7px 9px 7px 14px;
				background: var(--terminal-raised);
				border-top: 1px solid var(--terminal-line);
			}

			.command-prompt {
				flex: 0 0 auto;
				color: var(--terminal-green);
				font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
				font-size: 16px;
				font-weight: 700;
			}

			.command-input {
				width: 100%;
				min-width: 0;
				height: 34px;
				flex: 1;
				padding: 0 10px;
				color: var(--terminal-ink);
				font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
				font-size: 10.5px;
				background: rgba(255, 255, 255, 0.045);
				border: 1px solid transparent;
				border-radius: 8px;
				outline: none;
			}

			.command-input:focus {
				background: rgba(255, 255, 255, 0.058);
				border-color: rgba(181, 154, 255, 0.34);
				box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);

			.command-input::placeholder {
				color: var(--terminal-muted);

			.command-tools {
				display: flex;
				flex: 0 0 auto;
				align-items: center;
				gap: 1px;

			.command-tool {
				display: grid;
				width: 32px;
				height: 32px;
				place-items: center;
				color: var(--terminal-muted);
				border-radius: 7px;
			}

			.command-tool:hover {
				color: var(--terminal-ink);
				background: rgba(255, 255, 255, 0.065);
			}

			.command-tool svg {
				width: 15px;
				height: 15px;
			}

			.command-send {
				display: grid;
				width: 34px;
				height: 34px;
				place-items: center;
				color: #fff;
				background: linear-gradient(135deg, #8054f2, #b45cc5 60%, #df719e);
				border-radius: 8px;
				box-shadow: 0 8px 18px -14px rgba(139, 92, 246, 0.9);
			}

			.command-send:hover {
				filter: brightness(1.05);
			}

			.command-send svg {
				width: 15px;
				height: 15px;
			}

			.terminal-statusbar {
				display: flex;
				height: 28px;
				flex: 0 0 auto;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				padding: 0 13px;
				color: var(--terminal-muted);
				font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
				font-size: 8px;
				background: var(--terminal-raised);
				border-top: 1px solid var(--terminal-line);
			}

			.status-group {
				display: flex;
				min-width: 0;
				align-items: center;
				gap: 12px;
			}

			.status-item {
				display: inline-flex;
				align-items: center;
				gap: 5px;
				white-space: nowrap;
			}

			.status-dot {
				width: 5px;
				height: 5px;
				background: var(--terminal-green);
				border-radius: 50%;
				box-shadow: 0 0 0 3px rgba(79, 211, 155, 0.1);
			}

			.context-panel {
				position: absolute;
				top: 0;
				right: 0;
				bottom: 0;
				z-index: 42;
				display: flex;
				width: min(292px, 88vw);
				min-width: 0;
				min-height: 0;
				flex-direction: column;
				background: color-mix(in srgb, var(--surface-soft) 70%, var(--surface));
				border-left: 1px solid var(--line-strong);
				box-shadow: -22px 0 50px -38px rgba(0, 0, 0, 0.62);
				visibility: hidden;
				transform: translateX(100%);
				transition:
					transform 180ms ease,
					visibility 180ms ease;
			}

			.workspace-shell.context-open .context-panel {
				visibility: visible;
				transform: translateX(0);
			}

			.file-list {
				min-height: 0;
				flex: 1;
				overflow-y: auto;
				padding: 6px 8px 8px;
			}

			.file-row {
				display: flex;
				width: 100%;
				min-width: 0;
				align-items: center;
				gap: 9px;
				padding: 7px 6px;
				color: var(--ink-soft);
				text-align: left;
				border-radius: 7px;
			}

			.file-row:hover {
				color: var(--ink);
				background: var(--field);
				border-radius: 7px;
			}

			.file-icon {
				display: grid;
				width: 22px;
				height: 22px;
				flex: 0 0 auto;
				place-items: center;
				color: var(--accent-strong);
			}

			.file-icon.folder {
				color: var(--warning);
			}

			.file-icon svg {
				width: 15px;
				height: 15px;
			}

			.file-copy {
				min-width: 0;
				flex: 1;
			}

			.file-copy strong,
			.file-copy small {
				display: block;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.file-copy strong {
				font-size: 9.5px;
				font-weight: 600;
			}

			.file-copy small {
				margin-top: 2px;
				color: var(--muted);
				font-size: 7.5px;
			}

			.file-size {
				flex: 0 0 auto;
				color: var(--muted);
				font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
				font-size: 7.5px;
			}

			.context-footer {
				display: flex;
				height: 32px;
				flex: 0 0 auto;
				align-items: center;
				justify-content: space-between;
				padding: 0 13px;
				color: var(--muted);
				font-size: 7px;
				border-top: 1px solid var(--line);
			}

			.panel-scrim {
				position: absolute;
				inset: 0;
				z-index: 35;
				display: none;
				background: rgba(10, 11, 19, 0.4);
				backdrop-filter: blur(2px);
			}

			.workspace-shell.connections-open .panel-scrim,
			.workspace-shell.context-open .panel-scrim {
				display: block;
			}

			.toast {
				position: fixed;
				right: 20px;
				bottom: 20px;
				z-index: 110;
				display: flex;
				max-width: min(390px, calc(100vw - 32px));
				align-items: center;
				gap: 9px;
				padding: 11px 14px;
				color: var(--ink-soft);
				font-size: 10px;
				background: color-mix(in srgb, var(--surface) 97%, transparent);
				border: 1px solid var(--line-strong);
				border-radius: 12px;
				box-shadow: 0 22px 50px -30px rgba(20, 21, 50, 0.58);
				backdrop-filter: blur(16px);
				opacity: 0;
				transform: translateY(10px);
				pointer-events: none;
				transition:
					opacity 160ms ease,
					transform 160ms ease;
			}

			.toast.visible {
				opacity: 1;
				transform: translateY(0);
			}

			.toast svg {
				width: 14px;
				height: 14px;
				flex: 0 0 auto;
				color: var(--success);
			}

			@media (max-width: 1280px) {
				.nav-item {
					width: 42px;
					justify-content: center;
					padding: 0;
				}

				.nav-item span {
					display: none;
				}

				.workspace-grid {
					grid-template-columns: minmax(0, 1fr);
				}

				.workspace-shell.context-hidden .workspace-grid {
					grid-template-columns: minmax(0, 1fr);
				}
			}

			@media (max-width: 1180px) {
				.workspace-grid,
				.workspace-shell.context-hidden .workspace-grid {
					grid-template-columns: minmax(0, 1fr);
				}

				.context-panel {
					position: absolute;
					top: 0;
					right: 0;
					bottom: 0;
					z-index: 42;
					width: min(330px, 88vw);
					box-shadow: -22px 0 50px -38px rgba(0, 0, 0, 0.62);
					visibility: hidden;
					transform: translateX(100%);
					transition:
						transform 180ms ease,
						visibility 180ms ease;
				}

				.workspace-shell.context-open .context-panel {
					visibility: visible;
					transform: translateX(0);
				}

				.workspace-shell.context-open .panel-scrim,
				.workspace-shell.connections-open .panel-scrim {
					display: block;
				}

				.context-panel .mobile-panel-close {
					display: grid;
				}
			}

			@media (max-width: 960px) {
				.nav-shell {
					padding: 10px 12px 0;
				}

				.topbar {
					height: 62px;
					padding: 6px 7px 6px 10px;
					border-radius: 18px;

				.main-nav {
					display: none;

				.mobile-trigger {
					display: grid;

					height: 38px;

					border-radius: 17px;
					box-shadow: 0 22px 50px -34px rgba(20, 21, 50, 0.58);

					padding: 0 12px;

				.workspace-shell.context-hidden .workspace-grid {
					grid-template-columns: minmax(0, 1fr);
				}

				.session-menu-mobile {
					display: grid;
					width: 46px;
					flex: 0 0 auto;
					place-items: center;
					color: var(--muted);
					border-right: 1px solid var(--line);
				}

				.session-menu-mobile:hover {
					color: var(--ink);
					background: var(--field);
				}

				.session-menu-mobile svg {
					width: 17px;
					height: 17px;
				}

				.session-tab {
					min-width: 150px;
				}

				.session-actions .desktop-action {
					display: none;
				}

				.connections-panel {
					position: absolute;
					top: 0;
					bottom: 0;
					left: 0;
					z-index: 42;
					width: min(308px, 88vw);
					border-right: 1px solid var(--line-strong);
					box-shadow: 22px 0 50px -38px rgba(0, 0, 0, 0.62);
					visibility: hidden;
					transform: translateX(-100%);
					transition:
						transform 180ms ease,
						visibility 180ms ease;
				}

				.workspace-shell.connections-open .connections-panel {
					visibility: visible;
					transform: translateX(0);
				}

				.connections-panel .mobile-panel-close {
					display: grid;
				}

				.terminal-stage {
					padding: 14px 14px 12px;
				}

				.terminal-lines {
					font-size: 11.5px;
				}
			}

			@media (max-width: 760px) {
				.brand-copy small {
					display: none;
				}

				.session-bar-button {
					width: 42px;
				}

				.session-tab {
					min-width: 138px;
					padding-inline: 10px;
				}

				.terminal-head {
					padding-inline: 10px 7px;
				}

				.terminal-title small {
					max-width: 44vw;
				}

				.terminal-actions .desktop-only {
					display: none;
				}

				.command-row {
					min-height: 50px;
					gap: 6px;
					padding-inline: 10px 8px;
				}

				.command-tools .secondary-tool {
					display: none;
				}

				.terminal-statusbar {
					height: 25px;
				}

				.status-group.center {
					display: none;
				}

				.toast {
					right: 12px;
					bottom: 12px;
				}
			}

			@media (max-width: 480px) {
				.nav-shell {
					padding-inline: 8px;
				}

				.workspace-page {
					width: calc(100% - 16px);
					height: calc(100dvh - 86px);
					min-height: 520px;
				}

				.brand-copy {
					display: none;
				}

				.session-bar {
					height: 46px;
				}

				.session-tab {
					min-width: 126px;
				}

				.session-tab .tab-close {
					display: none;
				}

				.terminal-head {
					height: 45px;
				}

				.terminal-mark {
					width: 24px;
					height: 24px;
				}

				.terminal-title small {
					max-width: 38vw;
				}

				.terminal-actions .wide-action {
					display: none;
				}

				.terminal-stage {
					padding: 12px 11px 10px;
				}

				.terminal-lines {
					font-size: 10.5px;
					line-height: 1.62;
				}

				.command-input {
					font-size: 10px;
				}

				.command-tools .grid-tool {
					display: none;
				}

				.status-group.right .status-item:nth-child(2) {
					display: none;
				}

				.context-panel,
				.connections-panel {
					width: min(302px, 92vw);
				}
			}

			@media (max-width: 360px) {
				.tool-button {
					width: 36px;
					height: 36px;
				}

				.avatar {
					width: 30px;
					height: 30px;
				}

				.session-tab {
					min-width: 118px;
				}

				.terminal-actions .narrow-action {
					display: none;
				}

				.terminal-title small {
					max-width: 31vw;
				}

				.command-prompt {
					display: none;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					scroll-behavior: auto !important;
					transition-duration: 0.01ms !important;
					animation-duration: 0.01ms !important;
					animation-iteration-count: 1 !important;
				}
			}

					closePanels();
					shell.classList.toggle('context-open', open);
				}

				function toggleConnectionsPanel() {
					const open = !shell.classList.contains('connections-open');
					closePanels();
					shell.classList.toggle('connections-open', open);
				}

				function selectSession(button) {
					for (const tab of $$('.session-tab')) {
						tab.setAttribute('aria-selected', String(tab === button));
					}
					sessionName.textContent = button.dataset.sessionName || 'prod-web-01';
					sessionLabel.textContent = button.dataset.sessionHost || 'honus@prod-web-01: ~/srv/nexus';
					connectionIp.textContent = button.dataset.sessionIp || '10.24.8.11';
					for (const row of $$('.connection-row')) {
						row.setAttribute(
							'aria-current',
							String(row.dataset.sessionName === button.dataset.sessionName),
						);
					}
					showToast(`已切换到 ${button.dataset.sessionName}`);
				}

				function closeSession(tab) {
					const tabs = $$('.session-tab');
					if (tabs.length === 1) {
						showToast('至少保留一个终端会话');
						return;
					}
					const wasSelected = tab.getAttribute('aria-selected') === 'true';
					const index = tabs.indexOf(tab);
					const name = tab.dataset.sessionName;
					tab.remove();
					if (wasSelected) {
						const remaining = $$('.session-tab');
						selectSession(remaining[Math.min(index, remaining.length - 1)]);
					}
					showToast(`已关闭会话 ${name}`);
				}

				function bindSessionTab(tab) {
					tab.addEventListener('click', () => selectSession(tab));
					const close = $('.tab-close', tab);
					if (close) {
						close.addEventListener('click', (event) => {
							event.stopPropagation();
							closeSession(tab);
						});
					}
				}

				function createSessionTab(row) {
					const tab = document.createElement('button');
					tab.className = 'session-tab';
					tab.type = 'button';
					tab.setAttribute('role', 'tab');
					tab.setAttribute('aria-selected', 'false');
					tab.dataset.sessionName = row.dataset.sessionName;
					tab.dataset.sessionHost = row.dataset.sessionHost;
					tab.dataset.sessionIp = row.dataset.sessionIp;
					tab.innerHTML =
						'<span class="state-dot"></span><span class="session-tab-name"></span><span class="tab-close" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>';
					$('.session-tab-name', tab).textContent = row.dataset.sessionName;
					sessionTabs.append(tab);
					bindSessionTab(tab);
					tab.scrollIntoView({ block: 'nearest', inline: 'nearest' });
					return tab;
				}

				function selectConnection(row) {
					const name = row.dataset.sessionName;
					const tab = $$('.session-tab').find((item) => item.dataset.sessionName === name);
					if (tab) selectSession(tab);
					else {
						for (const item of $$('.connection-row'))
							item.setAttribute('aria-current', String(item === row));
						selectSession(createSessionTab(row));
					}
					closePanels();
				}

				function appendCommand(command) {
					const prompt = document.createElement('div');
					prompt.className = 'term-line';
					const promptParts = [sessionLabel.textContent.split(':')[0], ':', '~/srv/nexus', '$ '];
					const promptClasses = ['term-prompt', 'term-muted', 'term-path', 'term-muted'];
					promptParts.forEach((text, index) => {
						const span = document.createElement('span');
						span.className = promptClasses[index];
						span.textContent = text;
						prompt.append(span);
					});
					prompt.append(document.createTextNode(command));
					terminalLines.append(prompt);

					const output = document.createElement('div');
					output.className = 'term-line term-muted';
					output.textContent = `zsh: command queued · ${command}`;
					terminalLines.append(output);

					const nextPrompt = document.createElement('div');
					nextPrompt.className = 'term-line';
					nextPrompt.innerHTML =
						'<span class="term-prompt">honus@prod-web-01</span><span class="term-muted">:</span><span class="term-path">~/srv/nexus</span><span class="term-muted">$</span> <span class="term-cursor" aria-hidden="true"></span>';
					terminalLines.append(nextPrompt);
					terminalStage.scrollTop = terminalStage.scrollHeight;
				}

				$('#theme-toggle').addEventListener('click', () => {
					root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
					$('#theme-toggle').setAttribute(
						'aria-label',
						root.dataset.theme === 'dark' ? '切换浅色主题' : '切换深色主题',
					);
				});

				accountToggle.addEventListener('click', (event) => {
					event.stopPropagation();
					const open = accountMenu.hidden;
					closeMenus();
					accountMenu.hidden = !open;
					accountToggle.setAttribute('aria-expanded', String(open));
				});

				mobileToggle.addEventListener('click', (event) => {
					event.stopPropagation();
					const open = mobileSheet.hidden;
					closeMenus();
					mobileSheet.hidden = !open;
					mobileToggle.setAttribute('aria-expanded', String(open));
				});

				document.addEventListener('click', (event) => {
					if (!event.target.closest('.account-wrap')) {
						accountMenu.hidden = true;
						accountToggle.setAttribute('aria-expanded', 'false');
					}
					if (!event.target.closest('#mobile-toggle') && !event.target.closest('#mobile-sheet')) {
						mobileSheet.hidden = true;
						mobileToggle.setAttribute('aria-expanded', 'false');
					}
				});

				for (const tab of $$('.session-tab')) bindSessionTab(tab);
				for (const row of $$('.connection-row')) row.addEventListener('click', () => selectConnection(row));

				for (const button of $$('[data-action]')) {
					button.addEventListener('click', (event) => {
						const action = button.dataset.action;
						if (action === 'toggle-connections') {
							event.stopPropagation();
							toggleConnectionsPanel();
						} else if (action === 'toggle-context') {
							event.stopPropagation();
							toggleContextPanel();
						} else if (action === 'close-panels') closePanels();
						else if (action === 'new-session') {
							showToast('从连接列表选择一个主机开始新会话（设计稿演示）');
							if (window.matchMedia('(max-width: 960px)').matches) {
								closePanels();
								shell.classList.add('connections-open');
							}
						} else if (action === 'progress') showToast('2 个传输任务正在运行（设计稿演示）');
						else if (action === 'suspend') showToast('会话已标记为可挂起（设计稿演示）');
						else if (action === 'search') {
							commandInput.focus();
							showToast('终端搜索已聚焦到命令输入（设计稿演示）');
						} else if (action === 'copy') showToast('已复制当前选区（设计稿演示）');
						else if (action === 'clear') {
							terminalLines.innerHTML =
								'<div class="term-line term-muted">Terminal cleared · 10:44:08</div><div class="term-line"><span class="term-prompt">honus@prod-web-01</span><span class="term-muted">:</span><span class="term-path">~/srv/nexus</span><span class="term-muted">$</span> <span class="term-cursor" aria-hidden="true"></span></div>';
							showToast('终端输出已清空（设计稿演示）');
						} else if (action === 'terminal-settings') showToast('终端外观设置已打开（设计稿演示）');
						else if (action === 'quick-commands') showToast('快捷指令面板已打开（设计稿演示）');
						else if (action === 'layout') showToast('布局配置已打开（设计稿演示）');
						else if (action === 'upload') showToast('文件上传入口已打开（设计稿演示）');
						else if (action === 'refresh-files') showToast('文件列表已重新读取（设计稿演示）');
					});
				}

				commandForm.addEventListener('submit', (event) => {
					event.preventDefault();
					const command = commandInput.value.trim();
					if (!command) return;
					appendCommand(command);
					commandInput.value = '';
				});

				document.addEventListener('keydown', (event) => {
					if (event.key !== 'Escape') return;
					closePanels();
					closeMenus();
				});

				window.addEventListener('resize', closePanels);
			})();
		</script>
		<script src="shared/nav.js"></script>
	</body>
</html>
