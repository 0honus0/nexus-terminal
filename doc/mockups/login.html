<!doctype html>
<html lang="zh-CN" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>星枢终端 · 登录</title>
		<style>
			:root {
				color-scheme: light;
				--page: #eaedf7;
				--frame: #f8f9fd;
				--surface: #ffffff;
				--surface-soft: #f4f6fb;
				--field: #f8f9fd;
				--field-focus: #ffffff;
				--ink: #17182b;
				--ink-soft: #41445a;
				--muted: #73768a;
				--line: rgba(30, 31, 64, 0.1);
				--line-strong: rgba(30, 31, 64, 0.16);
				--accent: #8b5cf6;
				--accent-2: #d8679b;
				--accent-soft: rgba(139, 92, 246, 0.09);
				--success: #1f9d6a;
				--danger: #c84260;
				--frame-shadow: 0 38px 100px -54px rgba(31, 32, 78, 0.48), 0 8px 30px -18px rgba(31, 32, 78, 0.22);
				--card-shadow: 0 28px 70px -52px rgba(31, 32, 78, 0.48);
			}

			html[data-theme='dark'] {
				color-scheme: dark;
				--page: #080910;
				--frame: #0d0e16;
				--surface: #13141f;
				--surface-soft: #0f1019;
				--field: #10111b;
				--field-focus: #171825;
				--ink: #f4f1ff;
				--ink-soft: #d4d0e3;
				--muted: #9293a7;
				--line: rgba(255, 255, 255, 0.09);
				--line-strong: rgba(255, 255, 255, 0.16);
				--accent: #a483ff;
				--accent-2: #ef83af;
				--accent-soft: rgba(164, 131, 255, 0.12);
				--success: #55d6a0;
				--danger: #ff7f98;
				--frame-shadow: 0 44px 120px -48px rgba(0, 0, 0, 0.86), 0 0 0 1px rgba(255, 255, 255, 0.03);
				--card-shadow: 0 28px 80px -48px rgba(0, 0, 0, 0.82);
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				min-height: 100%;
			}

			body {
				display: flex;
				align-items: center;
				justify-content: center;
				margin: 0;
				min-height: 100svh;
				padding: 20px;
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC',
					'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
				color: var(--ink);
				background:
					radial-gradient(58rem 38rem at 5% 0%, rgba(118, 151, 255, 0.18), transparent 68%),
					radial-gradient(48rem 38rem at 100% 100%, rgba(218, 103, 155, 0.14), transparent 66%), var(--page);
				overflow-x: hidden;
				-webkit-font-smoothing: antialiased;
				text-rendering: optimizeLegibility;
			}

			body::before {
				position: fixed;
				inset: 0;
				z-index: -1;
				content: '';
				pointer-events: none;
				background-image:
					linear-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px),
					linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
				background-size: 48px 48px;
				mask-image: radial-gradient(circle at 50% 40%, black, transparent 78%);
				opacity: 0.36;
			}

			button,
			input {
				font: inherit;
			}

			button {
				color: inherit;
			}

			svg {
				display: block;
			}

			.stage {
				position: relative;
				display: grid;
				grid-template-columns: minmax(0, 1.14fr) minmax(430px, 0.86fr);
				width: min(1360px, calc(100% - 24px));
				height: min(800px, calc(100svh - 56px));
				margin: 0;
				overflow: hidden;
				background: var(--frame);
				border: 1px solid var(--line-strong);
				border-radius: 32px;
				box-shadow: var(--frame-shadow);
				isolation: isolate;
			}

			.hero {
				position: relative;
				display: flex;
				flex-direction: column;
				overflow: hidden;
				min-height: 0;
				padding: clamp(30px, 3.15vw, 46px);
				color: #fff;
				-webkit-user-select: none;
				user-select: none;
				background:
					radial-gradient(40rem 32rem at 92% 5%, rgba(224, 102, 164, 0.34), transparent 62%),
					radial-gradient(38rem 34rem at 4% 96%, rgba(100, 126, 255, 0.32), transparent 64%),
					linear-gradient(145deg, #2b2354 0%, #19172e 48%, #241831 100%);
			}

			.hero::before {
				position: absolute;
				inset: 0;
				content: '';
				pointer-events: none;
				background-image:
					linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
					linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px);
				background-size: 52px 52px;
				mask-image: linear-gradient(90deg, transparent 0%, black 45%, black 100%);
			}

			.hero::after {
				position: absolute;
				top: 8%;
				right: -18%;
				width: 68%;
				aspect-ratio: 1;
				content: '';
				pointer-events: none;
				border: 1px solid rgba(255, 255, 255, 0.08);
				border-radius: 50%;
				box-shadow:
					0 0 0 5.5rem rgba(255, 255, 255, 0.018),
					0 0 0 11rem rgba(255, 255, 255, 0.012);
			}

			.brand {
				position: relative;
				z-index: 1;
				display: flex;
				align-items: center;
				gap: 15px;
			}

			.brand-mark {
				display: grid;
				width: 50px;
				height: 50px;
				place-items: center;
				background: rgba(255, 255, 255, 0.1);
				border: 1px solid rgba(255, 255, 255, 0.15);
				border-radius: 18px;
				box-shadow:
					inset 0 1px 0 rgba(255, 255, 255, 0.17),
					0 14px 30px -20px rgba(0, 0, 0, 0.7);
				backdrop-filter: blur(16px);
			}

			.brand-mark img {
				width: 35px;
				height: auto;
				filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.26));
			}

			.brand-name {
				display: flex;
				flex-direction: column;
				gap: 2px;
			}

			.brand-name strong {
				font-size: 16px;
				font-weight: 700;
				letter-spacing: 0.06em;
			}

			.brand-name span {
				color: rgba(255, 255, 255, 0.48);
				font-size: 8.5px;
				font-weight: 650;
				letter-spacing: 0.2em;
			}

			.hero-main {
				position: relative;
				z-index: 1;
				width: min(100%, 640px);
				margin-block: auto;
				padding-block: clamp(24px, 4vh, 48px);
			}

			h1 {
				margin: 0;
				font-size: clamp(2.55rem, 3.45vw, 3.65rem);
				font-weight: 680;
				line-height: 1.12;
				letter-spacing: -0.045em;
			}

			h1 span {
				display: block;
			}

			h1 .accent {
				width: fit-content;
				color: transparent;
				background: linear-gradient(90deg, #d9c8ff 4%, #ffb1ca 58%, #ffd5b8 100%);
				background-clip: text;
				-webkit-background-clip: text;
			}

			.auth-panel {
				position: relative;
				display: grid;
				padding: clamp(24px, 3.4vw, 50px);
				place-items: center;
				background:
					radial-gradient(32rem 24rem at 100% 0%, var(--accent-soft), transparent 70%), var(--surface-soft);
				border-left: 1px solid var(--line);
			}

			.auth-card {
				width: min(100%, 430px);
				padding: clamp(26px, 3vw, 38px);
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: 26px;
				box-shadow: var(--card-shadow);
			}

			.auth-topline {
				display: flex;
				align-items: center;
				justify-content: flex-end;
			}

			.icon-button {
				display: grid;
				width: 36px;
				height: 36px;
				padding: 0;
				place-items: center;
				color: var(--muted);
				background: var(--surface-soft);
				border: 1px solid var(--line);
				border-radius: 11px;
				cursor: pointer;
				transition:
					color 160ms ease,
					border-color 160ms ease,
					background 160ms ease;
			}

			.icon-button:hover {
				color: var(--ink);
				background: var(--field);
				border-color: var(--line-strong);
			}

			.icon-button svg {
				width: 16px;
				height: 16px;
			}

			html[data-theme='light'] .icon-moon,
			html[data-theme='dark'] .icon-sun {
				display: none;
			}

			.auth-heading {
				margin: clamp(26px, 3.4vh, 34px) 0 0;
			}

			.auth-heading h2 {
				margin: 0;
				font-size: clamp(28px, 2.4vw, 36px);
				font-weight: 700;
				line-height: 1.2;
				letter-spacing: -0.035em;
			}

			.auth-heading p {
				margin: 9px 0 0;
				color: var(--muted);
				font-size: 13px;
				line-height: 1.7;
			}

			.login-form {
				display: grid;
				gap: 14px;
				margin-top: 28px;
			}

			.field label {
				display: block;
				margin-bottom: 7px;
				color: var(--ink-soft);
				font-size: 11px;
				font-weight: 650;
				letter-spacing: 0.02em;
			}

			.control {
				position: relative;
			}

			.control > svg {
				position: absolute;
				top: 50%;
				left: 15px;
				width: 17px;
				height: 17px;
				color: var(--muted);
				pointer-events: none;
				transform: translateY(-50%);
				transition: color 160ms ease;
			}

			.control input {
				width: 100%;
				height: 52px;
				padding: 0 46px 0 43px;
				color: var(--ink);
				background: var(--field);
				border: 1px solid var(--line-strong);
				border-radius: 14px;
				outline: none;
				transition:
					background 160ms ease,
					border-color 160ms ease,
					box-shadow 160ms ease;
			}

			.control input::placeholder {
				color: color-mix(in srgb, var(--muted) 72%, transparent);
			}

			.control input:focus {
				background: var(--field-focus);
				border-color: color-mix(in srgb, var(--accent) 72%, var(--line-strong));
				box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 13%, transparent);
			}

			.control:focus-within > svg {
				color: var(--accent);
			}

			.password-toggle {
				position: absolute;
				top: 50%;
				right: 8px;
				display: grid;
				width: 36px;
				height: 36px;
				padding: 0;
				place-items: center;
				color: var(--muted);
				background: transparent;
				border: 0;
				border-radius: 10px;
				transform: translateY(-50%);
				cursor: pointer;
			}

			.password-toggle:hover {
				color: var(--ink);
				background: var(--surface-soft);
			}

			.password-toggle svg {
				width: 17px;
				height: 17px;
			}

			.password-toggle .eye-off,
			.password-toggle.is-visible .eye-open {
				display: none;
			}

			.password-toggle.is-visible .eye-off {
				display: block;
			}

			.form-meta {
				display: flex;
				align-items: center;
				justify-content: flex-start;
				gap: 16px;
				margin-top: -1px;
			}

			.remember {
				display: inline-flex;
				align-items: center;
				gap: 9px;
				color: var(--muted);
				font-size: 12px;
				cursor: pointer;
				user-select: none;
			}

			.remember input {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip-path: inset(50%);
			}

			.checkmark {
				display: grid;
				width: 17px;
				height: 17px;
				place-items: center;
				background: var(--field);
				border: 1px solid var(--line-strong);
				border-radius: 5px;
				transition:
					background 150ms ease,
					border-color 150ms ease;
			}

			.checkmark svg {
				width: 11px;
				height: 11px;
				color: #fff;
				opacity: 0;
				transform: scale(0.7);
				transition:
					opacity 150ms ease,
					transform 150ms ease;
			}

			.remember input:checked + .checkmark {
				background: var(--accent);
				border-color: var(--accent);
			}

			.remember input:checked + .checkmark svg {
				opacity: 1;
				transform: scale(1);
			}

			.remember input:focus-visible + .checkmark {
				box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 15%, transparent);
			}

			.primary-button,
			.passkey-button {
				display: flex;
				width: 100%;
				height: 52px;
				align-items: center;
				justify-content: center;
				gap: 10px;
				padding: 0 17px;
				border-radius: 14px;
				cursor: pointer;
				transition:
					transform 150ms ease,
					box-shadow 150ms ease,
					background 150ms ease,
					border-color 150ms ease;
			}

			.primary-button {
				position: relative;
				margin-top: 2px;
				color: #fff;
				font-size: 13px;
				font-weight: 680;
				letter-spacing: 0.02em;
				background: linear-gradient(135deg, #8054f2 0%, #b45cc5 52%, #e16f9f 100%);
				border: 1px solid rgba(255, 255, 255, 0.2);
				box-shadow:
					inset 0 1px 0 rgba(255, 255, 255, 0.2),
					0 15px 30px -18px rgba(139, 92, 246, 0.9);
			}

			.primary-button:hover:not(:disabled) {
				transform: translateY(-1px);
				box-shadow:
					inset 0 1px 0 rgba(255, 255, 255, 0.24),
					0 20px 36px -18px rgba(139, 92, 246, 0.95);
			}

			.primary-button:active:not(:disabled) {
				transform: translateY(0);
			}

			.primary-button:disabled {
				cursor: wait;
				opacity: 0.82;
			}

			.primary-button .arrow {
				position: absolute;
				right: 17px;
				width: 16px;
				height: 16px;
				opacity: 0.72;
			}

			.spinner {
				display: none;
				width: 16px;
				height: 16px;
				border: 2px solid rgba(255, 255, 255, 0.35);
				border-top-color: #fff;
				border-radius: 50%;
				animation: spin 700ms linear infinite;
			}

			.primary-button.is-loading .spinner {
				display: block;
			}

			.primary-button.is-loading .arrow {
				display: none;
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}

			.divider {
				display: flex;
				align-items: center;
				gap: 12px;
				margin: 1px 0;
				color: var(--muted);
				font-size: 10px;
			}

			.divider::before,
			.divider::after {
				flex: 1;
				height: 1px;
				content: '';
				background: var(--line);
			}

			.passkey-button {
				color: var(--ink-soft);
				font-size: 12px;
				font-weight: 600;
				background: var(--surface);
				border: 1px solid var(--line-strong);
				box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
			}

			.passkey-button:hover:not(:disabled) {
				color: var(--ink);
				background: var(--field);
				border-color: color-mix(in srgb, var(--accent) 36%, var(--line-strong));
			}

			.passkey-button svg {
				width: 17px;
				height: 17px;
				color: var(--accent);
			}

			.error-message {
				display: none;
				margin: -4px 0 0;
				padding: 9px 11px;
				color: var(--danger);
				font-size: 11px;
				line-height: 1.55;
				background: color-mix(in srgb, var(--danger) 7%, transparent);
				border: 1px solid color-mix(in srgb, var(--danger) 20%, transparent);
				border-radius: 10px;
			}

			.error-message.is-visible {
				display: block;
			}

			.toast {
				position: fixed;
				bottom: 26px;
				left: 50%;
				z-index: 20;
				max-width: min(420px, calc(100vw - 40px));
				padding: 11px 16px;
				color: var(--ink-soft);
				font-size: 11px;
				line-height: 1.55;
				background: var(--surface);
				border: 1px solid var(--line-strong);
				border-radius: 12px;
				box-shadow: 0 18px 48px -28px rgba(20, 21, 50, 0.6);
				opacity: 0;
				pointer-events: none;
				transform: translate(-50%, 10px);
				transition:
					opacity 180ms ease,
					transform 180ms ease;
			}

			.toast.is-visible {
				opacity: 1;
				transform: translate(-50%, 0);
			}

			@media (max-width: 1100px) {
				.stage {
					grid-template-columns: minmax(0, 0.95fr) minmax(410px, 1.05fr);
				}

				.hero {
					padding: 38px;
				}
			}

			@media (max-width: 900px) {
				body {
					padding: 16px;
				}

				.stage {
					grid-template-columns: 1fr;
					grid-template-rows: auto minmax(0, 1fr);
					width: min(760px, 100%);
					height: min(860px, calc(100svh - 32px));
				}

				.hero {
					padding: 24px 28px 20px;
				}

				.hero-main {
					margin: 0;
					width: 100%;
					padding: 28px 0 0;
				}

				h1 {
					font-size: clamp(2rem, 5.8vw, 2.75rem);
				}

				.auth-panel {
					padding: 18px 24px 22px;
					border-top: 1px solid var(--line);
					border-left: 0;
				}

				.auth-card {
					padding: 24px 28px;
					border-radius: 22px;
				}

				.auth-heading {
					margin-top: 20px;
				}

				.auth-heading h2 {
					font-size: 29px;
				}

				.login-form {
					gap: 11px;
					margin-top: 20px;
				}

				.control input,
				.primary-button,
				.passkey-button {
					height: 48px;
				}
			}

			@media (min-width: 561px) and (max-width: 900px) and (max-height: 820px) {
				.hero {
					padding: 18px 24px 16px;
				}

				.hero-main {
					padding-top: 18px;
				}

				h1 {
					font-size: clamp(1.9rem, 4.5vw, 2.25rem);
				}

				.auth-panel {
					padding: 14px 20px 16px;
				}

				.auth-card {
					padding: 20px 24px;
				}

				.auth-heading {
					margin-top: 16px;
				}

				.login-form {
					gap: 9px;
					margin-top: 16px;
				}

				.control input,
				.primary-button,
				.passkey-button {
					height: 44px;
				}
			}

			@media (min-width: 561px) and (max-width: 900px) and (max-height: 720px) {
				.stage {
					height: auto;
					min-height: calc(100svh - 32px);
				}
			}

			@media (max-width: 560px) {
				body {
					align-items: flex-start;
					padding: 0;
				}

				body::before {
					background-size: 36px 36px;
				}

				.stage {
					width: 100%;
					height: auto;
					min-height: 100svh;
					margin: 0;
					border: 0;
					border-radius: 0;
				}

				.hero {
					padding: 18px 20px 14px;
				}

				.brand-mark {
					width: 42px;
					height: 42px;
					border-radius: 13px;
				}

				.brand-mark img {
					width: 30px;
				}

				.brand-name strong {
					font-size: 14px;
				}

				.hero-main {
					padding: 24px 0 0;
				}

				h1 {
					font-size: clamp(1.9rem, 9.2vw, 2.35rem);
				}

				.auth-panel {
					padding: 18px 14px 22px;
				}

				.auth-card {
					padding: 20px 18px;
					border-radius: 20px;
				}

				.auth-heading {
					margin-top: 18px;
				}

				.auth-heading h2 {
					font-size: 28px;
				}

				.login-form {
					margin-top: 18px;
				}
			}

			@media (min-width: 901px) and (max-height: 840px) {
				.hero {
					padding-block: 28px;
				}

				.hero-main {
					padding-block: 20px;
				}

				.auth-panel {
					padding-block: 14px;
				}

				.auth-card {
					padding: 28px 30px;
				}

				.auth-heading {
					margin-top: 22px;
				}

				.login-form {
					gap: 11px;
					margin-top: 20px;
				}

				.control input,
				.primary-button,
				.passkey-button {
					height: 48px;
				}
			}

			@media (max-width: 360px) {
				.hero {
					padding: 14px 16px 12px;
				}

				.hero-main {
					padding-top: 18px;
				}

				h1 {
					font-size: 1.75rem;
				}

				.auth-panel {
					padding: 14px 10px 18px;
				}

				.auth-card {
					padding: 18px 15px;
				}

				.auth-heading {
					margin-top: 16px;
				}

				.login-form {
					gap: 10px;
					margin-top: 16px;
				}
			}

			@media (max-width: 560px) and (max-height: 760px) {
				.hero {
					padding: 10px 16px;
				}

				.brand-mark {
					width: 36px;
					height: 36px;
					border-radius: 11px;
				}

				.brand-mark img {
					width: 26px;
				}

				.brand-name strong {
					font-size: 13.5px;
				}

				.brand-name span {
					font-size: 7.5px;
				}

				.hero-main {
					padding-top: 10px;
				}

				h1 {
					font-size: clamp(1.5rem, 7vw, 1.9rem);
					line-height: 1.08;
				}

				.auth-panel {
					padding: 10px 12px;
				}

				.auth-card {
					padding: 14px 16px;
				}

				.auth-heading {
					margin-top: 14px;
				}

				.auth-heading h2 {
					font-size: 26px;
				}

				.auth-heading p {
					margin-top: 6px;
					font-size: 12px;
				}

				.login-form {
					gap: 9px;
					margin-top: 14px;
				}

				.field label {
					margin-bottom: 5px;
					font-size: 10px;
				}

				.control input,
				.primary-button,
				.passkey-button {
					height: 44px;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					scroll-behavior: auto !important;
					animation-duration: 0.01ms !important;
					animation-iteration-count: 1 !important;
					transition-duration: 0.01ms !important;
				}
			}
		</style>
	</head>

					</div>
					<div class="brand-name">
						<strong>星枢终端</strong>
						<span>NEXUS TERMINAL</span>
					</div>
				</header>

				<div class="hero-main">
					<h1 id="hero-title">
						<span>一处登录</span>
						<span class="accent">连接每一台主机</span>
					</h1>
				</div>
			</section>

			<section class="auth-panel" aria-labelledby="login-title">
				<div class="auth-card">
					<div class="auth-topline">
						<button class="icon-button" id="theme-toggle" type="button" aria-label="切换深色主题">
							<svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
								<circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6" />
								<path
									d="M12 2.8v2M12 19.2v2M21.2 12h-2M4.8 12h-2M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4M18.5 18.5l-1.4-1.4M6.9 6.9 5.5 5.5"
									stroke="currentColor"
									stroke-width="1.6"
									stroke-linecap="round"
								/>
							</svg>
							<svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
								<path
									d="M20 15.1A8.2 8.2 0 0 1 8.9 4a8.2 8.2 0 1 0 11.1 11.1Z"
									stroke="currentColor"
									stroke-width="1.6"
									stroke-linejoin="round"
								/>
							</svg>
						</button>
					</div>

					<header class="auth-heading">
						<h2 id="login-title">欢迎回来</h2>
						<p>登录后继续进入你的终端工作区。</p>
					</header>

					<form class="login-form" id="login-form" novalidate>
						<div class="field">
							<label for="username">用户名</label>
							<div class="control">
								<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
									<circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.7" />
									<path
										d="M5 20c.6-4 3-6 7-6s6.4 2 7 6"
										stroke="currentColor"
										stroke-width="1.7"
										stroke-linecap="round"
									/>
								</svg>
								<input id="username" name="username" autocomplete="username" placeholder="输入用户名" />
							</div>
						</div>

						<div class="field">
							<label for="password">密码</label>
							<div class="control">
								<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
									<rect
										x="5"
										y="10"
										width="14"
										height="10"
										rx="2.5"
										stroke="currentColor"
										stroke-width="1.7"
									/>
									<path
										d="M8 10V8a4 4 0 0 1 8 0v2M12 14v2.2"
										stroke="currentColor"
										stroke-width="1.7"
										stroke-linecap="round"
									/>
								</svg>
								<input
									id="password"
									name="password"
									type="password"
									autocomplete="current-password"
									placeholder="输入密码"
								/>
								<button
									class="password-toggle"
									id="password-toggle"
									type="button"
									aria-label="显示密码"
								>
									<svg class="eye-open" viewBox="0 0 24 24" fill="none" aria-hidden="true">
										<path
											d="M3.5 12s3.1-5 8.5-5 8.5 5 8.5 5-3.1 5-8.5 5-8.5-5-8.5-5Z"
											stroke="currentColor"
											stroke-width="1.6"
										/>
										<circle cx="12" cy="12" r="2.3" stroke="currentColor" stroke-width="1.6" />
									</svg>
									<svg class="eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
										<path
											d="M4 4l16 16M9.9 7.4A9.8 9.8 0 0 1 12 7c5.4 0 8.5 5 8.5 5a14 14 0 0 1-2.3 2.7M6.3 8.4A14.7 14.7 0 0 0 3.5 12s3.1 5 8.5 5c1 0 2-.2 2.8-.5M10 10a2.8 2.8 0 0 0 4 4"
											stroke="currentColor"
											stroke-width="1.6"
											stroke-linecap="round"
											stroke-linejoin="round"
										/>
									</svg>
								</button>
							</div>
						</div>

						<div class="form-meta">
							<label class="remember">
								<input id="remember" type="checkbox" />
								<span class="checkmark">
									<svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
										<path
											d="m3.2 8.3 3 3L12.8 4.7"
											stroke="currentColor"
											stroke-width="1.9"
											stroke-linecap="round"
											stroke-linejoin="round"
										/>
									</svg>
								</span>
								记住我
							</label>
						</div>

						<p class="error-message" id="login-error" role="alert" aria-live="polite"></p>

						<button class="primary-button" id="login-button" type="submit">
							<span class="spinner" aria-hidden="true"></span>
							<span id="login-button-label">登录</span>
							<svg class="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
								<path
									d="M5 12h14M14 7l5 5-5 5"
									stroke="currentColor"
									stroke-width="1.8"
									stroke-linecap="round"
									stroke-linejoin="round"
								/>
							</svg>
						</button>

						<div class="divider">或</div>

						<button class="passkey-button" id="passkey-button" type="button">
							<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
								<circle cx="8.5" cy="12" r="3.5" stroke="currentColor" stroke-width="1.7" />
								<path
									d="M12 12h8M17 12v2.7M19.5 12v2M8.5 12h.01"
									stroke="currentColor"
									stroke-width="1.7"
									stroke-linecap="round"
								/>
							</svg>
							使用 Passkey 登录
						</button>
					</form>
				</div>
			</section>
		</main>

		<div class="toast" id="toast" role="status" aria-live="polite"></div>

		<script>
			const root = document.documentElement;
			const themeButton = document.getElementById('theme-toggle');
			const passwordInput = document.getElementById('password');
			const passwordToggle = document.getElementById('password-toggle');
			const form = document.getElementById('login-form');
			const errorMessage = document.getElementById('login-error');
			const loginButton = document.getElementById('login-button');
			const loginButtonLabel = document.getElementById('login-button-label');
			const passkeyButton = document.getElementById('passkey-button');
			const toast = document.getElementById('toast');
			let toastTimer;

			if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
				root.dataset.theme = 'dark';
			}

			function syncThemeLabel() {
				const isDark = root.dataset.theme === 'dark';
				themeButton.setAttribute('aria-label', isDark ? '切换浅色主题' : '切换深色主题');
			}

			function showToast(message) {
				window.clearTimeout(toastTimer);
				toast.textContent = message;
				toast.classList.add('is-visible');
				toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 3200);
			}

			themeButton.addEventListener('click', () => {
				root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
				syncThemeLabel();
			});

			passwordToggle.addEventListener('click', () => {
				const visible = passwordInput.type === 'text';
				passwordInput.type = visible ? 'password' : 'text';
				passwordToggle.classList.toggle('is-visible', !visible);
				passwordToggle.setAttribute('aria-label', visible ? '显示密码' : '隐藏密码');
				passwordInput.focus();
			});

			form.addEventListener('submit', (event) => {
				event.preventDefault();
				const username = document.getElementById('username').value.trim();
				const password = passwordInput.value;

				errorMessage.classList.remove('is-visible');
				if (!username || !password) {
					errorMessage.textContent = '请输入用户名和密码。';
					errorMessage.classList.add('is-visible');
					return;
				}

				loginButton.disabled = true;
				loginButton.classList.add('is-loading');
				loginButtonLabel.textContent = '正在登录…';

				window.setTimeout(() => {
					loginButton.disabled = false;
					loginButton.classList.remove('is-loading');
					loginButtonLabel.textContent = '登录';
					window.location.assign('dashboard.html');
				}, 850);
			});

			passkeyButton.addEventListener('click', () => {
				passkeyButton.disabled = true;
				showToast('正在使用 Passkey 登录…');
				window.setTimeout(() => window.location.assign('dashboard.html'), 650);
			});

			syncThemeLabel();
		</script>
		<script src="shared/nav.js"></script>
	</body>
</html>
