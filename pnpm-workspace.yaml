packages:
  - packages/*
  - tests/e2e

catalog:
  '@types/node': ^26.6.5
  axios: ^1.20.0
  dompurify: ^3.4.17
  pino: ^10.4.0
  puppeteer-core: 25.16.0

catalogs:
  node-build:
    typescript: ^7.0.2

overrides:
  dompurify: 'catalog:'

allowBuilds:
  bcrypt: true
  'cpu-features@0.0.10': false
  'esbuild@0.28.2': true
  ssh2: true
  'vue-demi@0.14.10': true

disallowWorkspaceCycles: true
failIfNoMatch: true
catalogPrune: true
verifyDepsBeforeRun: false
patchedDependencies:
  '@xterm/xterm@6.0.0': scripts/patches/@xterm__xterm@6.0.0.patch
  monaco-editor@0.57.0: scripts/patches/monaco-editor@0.57.0.patch
  splitpanes@4.1.2: scripts/patches/splitpanes@4.1.2.patch
