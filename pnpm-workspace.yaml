packages:
  - packages/*
  - tests

catalog:
  '@types/node': ^26.6.6
  axios: ^1.21.0
  dompurify: ^3.4.17
  pino: ^10.4.0
catalogs:
  node-build:
    typescript: ^7.0.2

overrides:
  dompurify: 'catalog:'
  'readdir-glob>minimatch': ^11.0.4
  'eslint>minimatch': ^11.0.4
  '@eslint/config-array>minimatch': ^11.0.4
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.4

allowBuilds:
  bcrypt: true
  'cpu-features@0.0.10': false
  'esbuild@0.28.2': true
  ssh2: true
  'vue-demi@0.14.10': true

disallowWorkspaceCycles: true
failIfNoMatch: true
catalogPrune: true
verifyDepsBeforeRun: false
patchedDependencies:
  # Temporary Node 26 fix; remove on the next ssh2 upgrade containing the upstream fixes (doc/DEPLOYMENT.md).
  ssh2@1.17.0: scripts/patches/ssh2@1.17.0.patch
  '@xterm/xterm@6.0.0': scripts/patches/@xterm__xterm@6.0.0.patch
  monaco-editor@0.57.0: scripts/patches/monaco-editor@0.57.0.patch
  splitpanes@4.1.2: scripts/patches/splitpanes@4.1.2.patch
  vue-chartjs@5.3.4: scripts/patches/vue-chartjs@5.3.4.patch
