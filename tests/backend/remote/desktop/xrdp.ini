[Globals]
ini_version=1
fork=true
port=3389
security_layer=tls
certificate=/etc/xrdp/cert.pem
key_file=/etc/xrdp/key.pem
crypt_level=high
max_bpp=24
bitmap_cache=true
bitmap_compression=true
allow_channels=true

[Logging]
LogFile=/tmp/xrdp.log
LogLevel=INFO
EnableSyslog=false
EnableConsole=true

[Channels]
rdpdr=true
rdpsnd=true
cliprdr=true
drdynvc=true

[vnc]
name=B10 isolated VNC desktop
lib=libvnc.so
username=na
password=ask
ip=127.0.0.1
port=5900
