upstream nexus_backend {
    server backend:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 10m; # 允许最大 10MB 的请求体

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # SPA 入口和 Service Worker 必须及时更新，不能与哈希静态资源一样缓存一年。
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }

    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Serve static files directly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebAuthn Related Origins must be served by the backend, not the SPA fallback.
    location = /.well-known/webauthn {
        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Agent SSE is a long-lived HTTP stream. Keep this more specific than the
    # generic API proxy so nginx never buffers it or applies normal API timeouts.
    location ~ ^/api/v1/(?:agent/events|apps/[^/]+/runs/[^/]+/events)$ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-store" always;
    }

    # Artifact payloads use the Agent's 50 MiB per-object Phase-1 ceiling and
    # stream directly to the backend instead of buffering the whole upload.
    location ~ ^/api/v1/apps/[^/]+/artifacts/[^/]+/content$ {
        client_max_body_size 50m;
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to the backend service. This intentionally does not
    # use ^~ so the more specific Agent SSE/artifact regex locations above win.
    location /api/ {
        # rewrite ^/api(/.*)$ $1 break; # Remove /api prefix before proxying - REMOVED to match backend routes
        proxy_pass http://nexus_backend; # Proxy to backend root, backend expects /api/v1/...

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep ordinary API requests on reusable upstream HTTP/1.1 connections.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Proxy WebSocket requests to the backend service
    location /ws/ {
        proxy_pass http://nexus_backend; # Backend handles WS on the same port

        # Required headers for WebSocket proxying
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_cache_bypass $http_upgrade; # Prevent caching issues
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Add headers for caching, security, etc.
    # Example: Cache assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }

    # PDF.js ships its module worker as .mjs. nginx's bundled mime.types does
    # not consistently map .mjs, and with nosniff browsers reject the worker
    # when it falls back to application/octet-stream.
    location ~* ^/assets/.*\.mjs$ {
        types { text/javascript mjs; }
        default_type text/javascript;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }

    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }
}
