upstream nexus_backend {
    # Backend listens on IPv4; Docker DNS can also return unreachable IPv6 peers.
    zone nexus_backend 64k;
    resolver 127.0.0.11 ipv6=off valid=10s;
    server backend:3001 resolve;
    keepalive 32;
}

# Private ingress peers can supply the NPM-observed source (dynamic Docker gateway).
# Deployment must protect this path; this is not proof that the peer is NPM.
geo $realip_remote_addr $nexus_ingress_trusted {
    default 0;
    127.0.0.0/8 1;
    ::1/128 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    fc00::/7 1;
}
map "$nexus_ingress_trusted:$http_x_forwarded_proto" $nexus_forwarded_proto {
    default $scheme;
    "1:https" https;
    "1:http" http;
}

server {
    listen 80;
    server_name localhost;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    # NPM must append/overwrite with its observed client as the last address.
    # Do not walk past a real LAN client into its self-supplied chain.
    real_ip_recursive off;
    client_max_body_size 10m; # 允许最大 10MB 的请求体

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

    # SPA 入口和 Service Worker 必须及时更新，不能与哈希静态资源一样缓存一年。
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }

    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Serve static files directly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebAuthn Related Origins must be served by the backend, not the SPA fallback.
    location = /.well-known/webauthn {
        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $nexus_forwarded_proto;
    }

    # Artifact payloads use the Agent's 50 MiB per-object Phase-1 ceiling and
    # stream directly to the backend instead of buffering the whole upload.
    location ~ ^/api/v1/apps/[^/]+/artifacts/[^/]+/content$ {
        client_max_body_size 50m;
        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $nexus_forwarded_proto;
    }

    # Plugin UI and frontend SDK are browser-visible only through the main Nexus origin.
    # Defining location-level add_header directives intentionally prevents inheritance
    # of the server-level X-Frame-Options: DENY; the plugin static server supplies its
    # own CSP/frame-ancestors/CORS/CORP/cache policy. These routes now share
    # the Backend 3001 listener; the Backend request handler keeps them outside
    # the ordinary API middleware/security-header path.
    location ^~ /plugins/ {
        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $nexus_forwarded_proto;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /sdk/ {
        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $nexus_forwarded_proto;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Proxy API requests to the backend service. This intentionally does not
    # use ^~ so the more specific Artifact regex location above can win.
    location /api/ {
        # rewrite ^/api(/.*)$ $1 break; # Remove /api prefix before proxying - REMOVED to match backend routes
        proxy_pass http://nexus_backend; # Proxy to backend root, backend expects /api/v1/...

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $nexus_forwarded_proto;

        # Keep ordinary API requests on reusable upstream HTTP/1.1 connections.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Proxy WebSocket requests to the backend service
    location /ws/ {
        proxy_pass http://nexus_backend; # Backend handles WS on the same port
        proxy_buffer_size 8k;

        # Required headers for WebSocket proxying
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_cache_bypass $http_upgrade; # Prevent caching issues
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $nexus_forwarded_proto;
    }

    # Optional: Add headers for caching, security, etc.
    # Example: Cache assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }

    # PDF.js ships its module worker as .mjs. nginx's bundled mime.types does
    # not consistently map .mjs, and with nosniff browsers reject the worker
    # when it falls back to application/octet-stream.
    location ~* ^/assets/.*\.mjs$ {
        types { text/javascript mjs; }
        default_type text/javascript;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }

    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }
}
