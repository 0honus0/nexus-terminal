name: E2E Runner Image

on:
  push:
    paths:
      - "test/e2e/Dockerfile.runner"
      - "scripts/e2e/**"
      - ".github/workflows/e2e-runner-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}-e2e-runner

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build, smoke-check, and push E2E runner image
        run: scripts/e2e/build-runner-image.sh --push --image "$IMAGE"
