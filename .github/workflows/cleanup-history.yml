name: Clean old Actions and container versions

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep main, dev and latest in project images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Verify cleanup retention and failure handling
        run: |
          command -v unzip
          command -v zip
          node --test tests/tooling/maintenance/logic/cleanup-history.native.test.mjs

      - name: Clean old versions, runs, artifacts and caches
        uses: actions/github-script@v9.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          retries: 3
          script: |
            const { default: cleanup } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/maintenance/cleanup-history.mjs`);
            await cleanup({ github, context, core });
