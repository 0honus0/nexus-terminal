name: Update functional screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/frontend/**"
      - "packages/backend/**"
      - "test/e2e/**"
      - ".github/workflows/update-functional-screenshots.yml"

permissions:
  contents: write

concurrency:
  group: functional-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            packages/backend/package-lock.json
            packages/frontend/package-lock.json
            test/e2e/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix packages/backend

      - name: Install frontend dependencies
        run: npm ci --prefix packages/frontend

      - name: Install E2E dependencies
        run: npm ci --prefix test/e2e

      - name: Install Chromium and system dependencies
        working-directory: test/e2e
        run: npx playwright install --with-deps chromium

      - name: Generate functional screenshots
        run: npm --prefix test/e2e run test:docs

      - name: Upload generated screenshots
        uses: actions/upload-artifact@v7
        with:
          name: nexus-functional-screenshots
          path: doc/imgs/e2e/*.png
          if-no-files-found: error

      - name: Commit refreshed screenshots
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- doc/imgs/e2e)" ]]; then
            echo "Functional screenshots are already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/imgs/e2e
          git commit -m "docs: refresh functional screenshots [skip ci]"
          git push
