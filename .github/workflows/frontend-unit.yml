name: Frontend unit tests

on:
  push:
    paths:
      - 'packages/frontend/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend-unit.yml'
  pull_request:
    paths:
      - 'packages/frontend/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend-unit.yml'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile --filter @nexus-terminal/frontend
      - run: pnpm --filter @nexus-terminal/frontend test:unit
      - run: pnpm --filter @nexus-terminal/frontend exec vue-tsc --noEmit
