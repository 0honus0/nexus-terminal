name: Publish container image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or ref to publish
        required: true
        default: main
        type: string
      channel:
        description: Image channel to publish
        required: true
        default: dev
        type: choice
        options:
          - dev
          - release
      architecture:
        description: Image architecture to build
        required: true
        default: amd
        type: choice
        options:
          - arm
          - amd
          - all
      image_tag:
        description: Optional image tag (defaults to sha-<commit>)
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare publication
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.source.outputs.ref }}
      source_sha: ${{ steps.source_commit.outputs.sha }}
      image_tag: ${{ steps.image_tag.outputs.value }}
      channel: ${{ steps.channel.outputs.value }}
      channel_tag: ${{ steps.channel.outputs.tag }}
      architecture: ${{ steps.architecture.outputs.value }}
      platforms: ${{ steps.architecture.outputs.platforms }}

    steps:
      - name: Select publication source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            source_ref="$RELEASE_TAG"
          else
            source_ref="${REQUESTED_SOURCE_REF:-main}"
          fi

          if [[ -z "$source_ref" ]]; then
            echo "Publication source ref must not be empty" >&2
            exit 1
          fi

          echo "ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Resolve source commit
        id: source_commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm and Node.js for dependency audit
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Select image tag
        id: image_tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            image_tag="$RELEASE_TAG"
          elif [[ -n "$REQUESTED_TAG" ]]; then
            image_tag="$REQUESTED_TAG"
          else
            image_tag="sha-${SOURCE_SHA::12}"
          fi

          if [[ ! "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $image_tag" >&2
            exit 1
          fi
          echo "value=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Select image channel
        id: channel
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            channel="release"
          else
            channel="${REQUESTED_CHANNEL:-dev}"
          fi

          case "$channel" in
            dev)
              channel_tag="dev"
              ;;
            release)
              channel_tag="latest"
              ;;
            *)
              echo "Unsupported image channel: $channel" >&2
              exit 1
              ;;
          esac

          echo "value=$channel" >> "$GITHUB_OUTPUT"
          echo "tag=$channel_tag" >> "$GITHUB_OUTPUT"

      - name: Select image architecture
        id: architecture
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            architecture="all"
          else
            architecture="${REQUESTED_ARCHITECTURE:-amd}"
          fi

          case "$architecture" in
            arm)
              platforms="linux/arm64"
              ;;
            amd)
              platforms="linux/amd64"
              ;;
            all)
              platforms="linux/amd64,linux/arm64"
              ;;
            *)
              echo "Unsupported architecture: $architecture" >&2
              exit 1
              ;;
          esac

          echo "value=$architecture" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

      - name: Validate release versions
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          manifests=(
            package.json
            packages/agent-runner/package.json
            packages/backend/package.json
            packages/frontend/package.json
          )

          for manifest in "${manifests[@]}"; do
            manifest_version="$(node -p "require('./$manifest').version")"
            if [[ "$manifest_version" != "$release_version" ]]; then
              echo "$manifest version $manifest_version does not match release $RELEASE_TAG" >&2
              exit 1
            fi
          done

  publish:
    name: Publish unified image (${{ needs.prepare.outputs.channel }}, ${{ needs.prepare.outputs.architecture }})
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Set image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/nexus-terminal" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: needs.prepare.outputs.architecture != 'amd'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ needs.prepare.outputs.platforms }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.prepare.outputs.channel_tag }}
            ${{ steps.image.outputs.name }}:${{ needs.prepare.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_tag }}
          cache-from: type=gha,scope=unified-image
          cache-to: type=gha,mode=max,scope=unified-image

  # Agent Runner 使用独立镜像发布，tag 与主镜像保持一致，便于 Compose/宿主部署锁定同一版本。
  publish-runner:
    name: Publish Agent Runner image (${{ needs.prepare.outputs.channel }}, ${{ needs.prepare.outputs.architecture }})
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Set Runner image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/nexus-agent-runner" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: needs.prepare.outputs.architecture != 'amd'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Agent Runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/docker/agent-runner/Dockerfile
          platforms: ${{ needs.prepare.outputs.platforms }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.prepare.outputs.channel_tag }}
            ${{ steps.image.outputs.name }}:${{ needs.prepare.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_tag }}
          cache-from: type=gha,scope=agent-runner-image
          cache-to: type=gha,mode=max,scope=agent-runner-image
