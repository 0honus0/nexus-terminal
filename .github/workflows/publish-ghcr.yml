name: Publish container images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      component:
        description: Component to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend
          - remote-gateway
      image_tag:
        description: Optional image tag (defaults to sha-<commit>)
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}-${{ inputs.component || 'all' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare publication
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.components.outputs.value }}
      image_tag: ${{ steps.image_tag.outputs.value }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select components
        id: components
        shell: bash
        env:
          REQUESTED_COMPONENT: ${{ inputs.component || 'all' }}
        run: |
          case "$REQUESTED_COMPONENT" in
            all)
              components='["backend","frontend","remote-gateway"]'
              ;;
            backend|frontend|remote-gateway)
              components="[\"$REQUESTED_COMPONENT\"]"
              ;;
            *)
              echo "Unsupported component: $REQUESTED_COMPONENT" >&2
              exit 1
              ;;
          esac
          echo "value=$components" >> "$GITHUB_OUTPUT"

      - name: Select image tag
        id: image_tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            image_tag="$RELEASE_TAG"
          elif [[ -n "$REQUESTED_TAG" ]]; then
            image_tag="$REQUESTED_TAG"
          else
            image_tag="sha-${GITHUB_SHA::12}"
          fi

          if [[ ! "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $image_tag" >&2
            exit 1
          fi
          echo "value=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Validate release versions
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          manifests=(
            package.json
            packages/backend/package.json
            packages/frontend/package.json
            packages/remote-gateway/package.json
          )

          for manifest in "${manifests[@]}"; do
            manifest_version="$(node -p "require('./$manifest').version")"
            if [[ "$manifest_version" != "$release_version" ]]; then
              echo "$manifest version $manifest_version does not match release $RELEASE_TAG" >&2
              exit 1
            fi
          done

  publish:
    name: Publish ${{ matrix.component }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.prepare.outputs.components) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/nexus-terminal-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: packages/${{ matrix.component }}
          file: packages/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ needs.prepare.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_tag }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
