name: Update dependencies

on:
  schedule:
    # Every Monday at 02:23 UTC.
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: nexus-dependency-updates
  cancel-in-progress: true

env:
  UPDATE_BRANCH: chore/dependency-updates

jobs:
  update:
    name: Update workspace dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Create update branch
        shell: bash
        run: git checkout -B "$UPDATE_BRANCH"

      - name: Update workspace dependencies
        run: pnpm update --depth 0 --recursive

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- \
            package.json pnpm-workspace.yaml pnpm-lock.yaml \
            packages/frontend/package.json packages/backend/package.json packages/agent-runner/package.json tests/e2e/package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency updates are available." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Dependency updates"
              echo
              echo '```text'
              git diff --stat -- \
                package.json pnpm-workspace.yaml pnpm-lock.yaml \
                packages/frontend/package.json packages/backend/package.json packages/agent-runner/package.json tests/e2e/package.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify frozen workspace install
        if: steps.changes.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        if: steps.changes.outputs.changed == 'true'
        run: pnpm run format:all:check

      - name: Build production packages
        if: steps.changes.outputs.changed == 'true'
        run: |
          pnpm run build
          pnpm run build:agent-runner

      - name: Audit production dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pnpm audit --prod --audit-level=high

      - name: Commit and push update branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json pnpm-workspace.yaml pnpm-lock.yaml \
            packages/frontend/package.json packages/backend/package.json packages/agent-runner/package.json tests/e2e/package.json
          git commit -m "chore(deps): update Nexus dependencies"
          git push --force-with-lease origin "HEAD:$UPDATE_BRANCH"

      - name: Create dependency update pull request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          existing_pr="$(gh pr list \
            --base "$BASE_BRANCH" \
            --head "$UPDATE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$existing_pr" ]]; then
            echo "Updated existing dependency PR #$existing_pr." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$UPDATE_BRANCH" \
            --title "chore(deps): update Nexus dependencies" \
            --body $'Automated dependency refresh for the Nexus pnpm workspace.\n\nBefore this PR is created or updated, this workflow verifies a frozen install, formatting, production builds, and production dependency audit. This updater then explicitly dispatches the canonical E2E workflow on the dependency branch, which runs the browser/API project matrix directly without a secondary release gate. Major-version upgrades remain constrained by the workspace dependency ranges.'

      - name: Dispatch canonical E2E
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run e2e.yml --ref "$UPDATE_BRANCH"
          echo "Dispatched canonical E2E for $UPDATE_BRANCH." >> "$GITHUB_STEP_SUMMARY"
