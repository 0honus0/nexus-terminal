name: Update dependencies

on:
  schedule:
    # Every Monday at 02:23 UTC.
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nexus-dependency-updates
  cancel-in-progress: false

env:
  UPDATE_BRANCH: chore/dependency-updates

jobs:
  update:
    name: Update frontend and backend
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Create update branch
        shell: bash
        run: git checkout -B "$UPDATE_BRANCH"

      - name: Update frontend and backend dependencies
        run: >-
          pnpm update --depth 0
          --filter @nexus-terminal/frontend
          --filter @nexus-terminal/backend

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- \
            pnpm-workspace.yaml pnpm-lock.yaml \
            packages/frontend/package.json packages/backend/package.json packages/agent-runner/package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency updates are available." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Dependency updates"
              echo
              echo '```text'
              git diff --stat -- \
                pnpm-workspace.yaml pnpm-lock.yaml \
                packages/frontend/package.json packages/backend/package.json packages/agent-runner/package.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build frontend
        if: steps.changes.outputs.changed == 'true'
        run: pnpm run build:frontend

      - name: Build backend
        if: steps.changes.outputs.changed == 'true'
        run: pnpm run build:backend

      - name: Build Agent Runtime
        if: steps.changes.outputs.changed == 'true'
        run: pnpm run build:agent-runner

      - name: Audit dependencies
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          pnpm audit --audit-level=high

      - name: Run production ingress WebAuthn E2E
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          NODE_ENV: test
          PORT: '3001'
          NEXUS_DATA_DIR: ${{ runner.temp }}/nexus-terminal-ingress-data
          SESSION_COOKIE_NAME: nexus.ingress.sid
          SESSION_SECRET: ingress-session-secret-do-not-use-outside-tests-0000000000000000000000
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          RP_ID: ssh.honus.top
          RP_ORIGIN: https://ssh.honus.top,https://ssh.trui.de
        run: |
          set -euo pipefail

          backend_log="$RUNNER_TEMP/nexus-terminal-ingress-backend.log"
          ingress_container="nexus-terminal-ingress-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          node packages/backend/dist/index.js >"$backend_log" 2>&1 &
          backend_pid=$!

          cleanup() {
            docker rm -f "$ingress_container" >/dev/null 2>&1 || true
            kill "$backend_pid" >/dev/null 2>&1 || true
            wait "$backend_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          backend_ready=0
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:3001/api/v1/status >/dev/null; then
              backend_ready=1
              break
            fi
            if ! kill -0 "$backend_pid" >/dev/null 2>&1; then
              cat "$backend_log"
              exit 1
            fi
            sleep 1
          done

          if [[ "$backend_ready" -ne 1 ]]; then
            cat "$backend_log"
            exit 1
          fi

          docker run -d \
            --name "$ingress_container" \
            --add-host backend:host-gateway \
            -p 127.0.0.1:18112:80 \
            -v "$PWD/packages/frontend/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/packages/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine >/dev/null

          ingress_ready=0
          for _ in {1..60}; do
            if curl -fsS -H 'Host: ssh.honus.top' http://127.0.0.1:18112/.well-known/webauthn >/dev/null; then
              ingress_ready=1
              break
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' "$ingress_container" 2>/dev/null || true)" != "true" ]]; then
              docker logs "$ingress_container" || true
              cat "$backend_log"
              exit 1
            fi
            sleep 1
          done

          if [[ "$ingress_ready" -ne 1 ]]; then
            docker logs "$ingress_container" || true
            cat "$backend_log"
            exit 1
          fi

          if ! NEXUS_PRODUCTION_BASE_URL=http://127.0.0.1:18112 pnpm --filter @nexus-terminal/e2e run test:ingress; then
            docker logs "$ingress_container" || true
            cat "$backend_log"
            exit 1
          fi

      - name: Install Chromium and system dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pnpm --filter @nexus-terminal/e2e exec playwright install --with-deps chromium

      - name: Install remote archive command dependencies
        if: steps.changes.outputs.changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y zip unzip bzip2

      - name: Run HTTP, WebSocket, UI, SSH, SFTP, and Mobile E2E
        if: steps.changes.outputs.changed == 'true'
        run: pnpm run test:e2e

      - name: Upload dependency update E2E logs
        if: always() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dependency-update-e2e-logs
          path: packages/e2e/logs/
          if-no-files-found: ignore

      - name: Upload dependency update Playwright report
        if: failure() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dependency-update-playwright-report
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          if-no-files-found: ignore

      - name: Commit and push update branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pnpm-workspace.yaml pnpm-lock.yaml \
            packages/frontend/package.json packages/backend/package.json packages/agent-runner/package.json
          git commit -m "chore(deps): update Nexus dependencies"
          git push --force-with-lease origin "HEAD:$UPDATE_BRANCH"

      - name: Create dependency update pull request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          existing_pr="$(gh pr list \
            --base "$BASE_BRANCH" \
            --head "$UPDATE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$existing_pr" ]]; then
            echo "Updated existing dependency PR #$existing_pr." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$UPDATE_BRANCH" \
            --title "chore(deps): update Nexus dependencies" \
            --body $'Automated dependency refresh for the Nexus pnpm workspace (frontend/backend direct dependencies and their shared catalog entries).\n\nBefore this PR is created or updated, the workflow builds Frontend, Backend, and Agent Runtime, runs `pnpm audit --audit-level=high`, and passes the full Nexus E2E suite. Major-version upgrades are intentionally excluded.'
