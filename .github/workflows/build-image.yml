name: Build unified image

on:
  push:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'packages/**'
      - 'build.sh'
      - 'package.json'
      - '.github/workflows/build-image.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'packages/**'
      - 'build.sh'
      - 'package.json'
      - '.github/workflows/build-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=unified-image
          cache-to: type=gha,mode=max,scope=unified-image
