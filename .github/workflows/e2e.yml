name: E2E

on:
  push:
    paths:
      - "packages/backend/**"
      - "packages/frontend/**"
      - "packages/remote-gateway/**"
      - "test/e2e/**"
      - "package.json"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "packages/backend/**"
      - "packages/frontend/**"
      - "packages/remote-gateway/**"
      - "test/e2e/**"
      - "package.json"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
    inputs:
      workers:
        description: Parallel E2E group workers; leave blank to use groups/settings.json
        required: false
        type: string
      isolation:
        description: Run every main E2E spec as an independent Playwright invocation
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.groups.outputs.workers }}
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve and validate E2E groups
        id: groups
        shell: bash
        env:
          REQUESTED_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.workers || '' }}
        run: |
          set -euo pipefail
          workers="$REQUESTED_WORKERS"
          if [[ -z "$workers" ]]; then
            workers="$(node -p "require('./test/e2e/groups/settings.json').workers")"
          fi

          node test/e2e/support/groups.mjs generate --workers "$workers"
          node test/e2e/support/groups.mjs check --workers "$workers"
          matrix="$(node test/e2e/support/groups.mjs matrix --workers "$workers")"

          echo "workers=$workers" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-and-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            packages/backend/package-lock.json
            packages/frontend/package-lock.json
            packages/remote-gateway/package-lock.json
            test/e2e/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix packages/backend
          npm ci --prefix packages/frontend
          npm ci --prefix packages/remote-gateway
          npm ci --prefix test/e2e

      - name: Build packages
        run: |
          npm run build --prefix packages/backend
          npm run build --prefix packages/frontend
          npm run build --prefix packages/remote-gateway

      - name: Run production ingress WebAuthn E2E
        shell: bash
        env:
          NODE_ENV: test
          PORT: "3001"
          NEXUS_DATA_DIR: ${{ runner.temp }}/nexus-terminal-ingress-data
          SESSION_COOKIE_NAME: nexus.ingress.sid
          SESSION_SECRET: ingress-session-secret-do-not-use-outside-tests-0000000000000000000000
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          REMOTE_GATEWAY_SHARED_SECRET: ingress-remote-gateway-shared-secret-do-not-use-outside-tests
          RP_ID: ssh.honus.top
          RP_ORIGIN: https://ssh.honus.top,https://ssh.trui.de
        run: |
          set -euo pipefail

          backend_log="$RUNNER_TEMP/nexus-terminal-ingress-backend.log"
          ingress_container="nexus-terminal-ingress-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          node packages/backend/dist/index.js >"$backend_log" 2>&1 &
          backend_pid=$!

          cleanup() {
            docker rm -f "$ingress_container" >/dev/null 2>&1 || true
            kill "$backend_pid" >/dev/null 2>&1 || true
            wait "$backend_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          backend_ready=0
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:3001/api/v1/status >/dev/null; then
              backend_ready=1
              break
            fi
            if ! kill -0 "$backend_pid" >/dev/null 2>&1; then
              cat "$backend_log"
              exit 1
            fi
            sleep 1
          done

          if [[ "$backend_ready" -ne 1 ]]; then
            cat "$backend_log"
            exit 1
          fi

          docker run -d \
            --name "$ingress_container" \
            --add-host backend:host-gateway \
            -p 127.0.0.1:18112:80 \
            -v "$PWD/packages/frontend/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/packages/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine >/dev/null

          ingress_ready=0
          for _ in {1..60}; do
            if curl -fsS -H 'Host: ssh.honus.top' http://127.0.0.1:18112/.well-known/webauthn >/dev/null; then
              ingress_ready=1
              break
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' "$ingress_container" 2>/dev/null || true)" != "true" ]]; then
              docker logs "$ingress_container" || true
              cat "$backend_log"
              exit 1
            fi
            sleep 1
          done

          if [[ "$ingress_ready" -ne 1 ]]; then
            docker logs "$ingress_container" || true
            cat "$backend_log"
            exit 1
          fi

          if ! NEXUS_PRODUCTION_BASE_URL=http://127.0.0.1:18112 npm --prefix test/e2e run test:ingress; then
            docker logs "$ingress_container" || true
            cat "$backend_log"
            exit 1
          fi

  playwright-groups:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      E2E_GROUP_WORKERS: ${{ needs.prepare.outputs.workers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            packages/backend/package-lock.json
            packages/frontend/package-lock.json
            test/e2e/package-lock.json

      - name: Install E2E runtime dependencies
        run: |
          npm ci --prefix packages/backend
          npm ci --prefix packages/frontend
          npm ci --prefix test/e2e

      - name: Install Chromium and system dependencies
        working-directory: test/e2e
        run: npx playwright install --with-deps chromium

      - name: Install remote archive command dependencies
        run: sudo apt-get update && sudo apt-get install -y zip unzip bzip2

      - name: Generate deterministic group configuration
        run: |
          node test/e2e/support/groups.mjs generate --workers "$E2E_GROUP_WORKERS"
          node test/e2e/support/groups.mjs check --workers "$E2E_GROUP_WORKERS"

      - name: Run E2E group ${{ matrix.group }} of ${{ needs.prepare.outputs.workers }}
        run: node test/e2e/support/groups.mjs run --workers "$E2E_GROUP_WORKERS" --group "${{ matrix.group }}"

      - name: Upload group timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timings-group-${{ matrix.group }}
          path: test/e2e/.tmp/spec-timings-group-${{ matrix.group }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-logs-group-${{ matrix.group }}
          path: test/e2e/logs/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-report-group-${{ matrix.group }}
          path: |
            test/e2e/playwright-report/
            test/e2e/test-results/
          if-no-files-found: ignore

  isolation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.isolation }}
    needs: [build-and-ingress, playwright-groups]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            packages/backend/package-lock.json
            packages/frontend/package-lock.json
            test/e2e/package-lock.json

      - name: Install E2E runtime dependencies
        run: |
          npm ci --prefix packages/backend
          npm ci --prefix packages/frontend
          npm ci --prefix test/e2e

      - name: Install Chromium and system dependencies
        working-directory: test/e2e
        run: npx playwright install --with-deps chromium

      - name: Install remote archive command dependencies
        run: sudo apt-get update && sudo apt-get install -y zip unzip bzip2

      - name: Run per-spec isolation audit
        run: npm run test:e2e:isolation

      - name: Upload isolation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-isolation-logs
          path: test/e2e/logs/
          if-no-files-found: ignore

  rebalance:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
    needs: [prepare, build-and-ingress, playwright-groups]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download timing artifacts through the Actions API
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="test/e2e/.tmp/timing-artifacts"
          mkdir -p "$artifact_root"

          response="$RUNNER_TEMP/e2e-artifacts.json"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > "$response"

          mapfile -t artifacts < <(jq -r '.artifacts[] | select(.name | startswith("e2e-timings-group-")) | [.id, .name] | @tsv' "$response")
          if [[ "${#artifacts[@]}" -ne "${{ needs.prepare.outputs.workers }}" ]]; then
            echo "Expected ${{ needs.prepare.outputs.workers }} timing artifacts, found ${#artifacts[@]}" >&2
            exit 1
          fi

          for artifact in "${artifacts[@]}"; do
            IFS=$'\t' read -r artifact_id artifact_name <<< "$artifact"
            zip_path="$RUNNER_TEMP/${artifact_name}.zip"
            target="$artifact_root/$artifact_name"
            mkdir -p "$target"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$zip_path"
            unzip -q "$zip_path" -d "$target"
          done

      - name: Update timing history and rebalance default groups
        run: |
          node test/e2e/support/groups.mjs update-timings --input-dir test/e2e/.tmp/timing-artifacts
          node test/e2e/support/groups.mjs generate
          node test/e2e/support/groups.mjs check

      - name: Commit refreshed E2E timing data
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- test/e2e/groups; then
            echo "No E2E grouping changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/e2e/groups
          git commit -m "chore(e2e): refresh group timings [skip ci]"
          if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "::warning::E2E timing refresh could not be pushed; a newer branch update may have won the race."
          fi
