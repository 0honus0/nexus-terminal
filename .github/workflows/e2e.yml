name: E2E

on:
  push:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - '.dockerignore'
      - 'packages/**'
      - 'tests/**'
      - 'scripts/e2e/**'
      - 'scripts/docker/**'
      - 'scripts/checks/**'
      - 'scripts/format/**'
      - 'scripts/build/build.sh'
      - '.prettierignore'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/publish-ghcr.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - '.dockerignore'
      - 'packages/**'
      - 'tests/**'
      - 'scripts/e2e/**'
      - 'scripts/docker/**'
      - 'scripts/checks/**'
      - 'scripts/format/**'
      - 'scripts/build/build.sh'
      - '.prettierignore'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/publish-ghcr.yml'
  workflow_dispatch:
    inputs:
      test_runners:
        description: Number of test runners for module, protocol and browser shards
        required: true
        default: '8'
        type: choice
        options:
          - '6'
          - '7'
          - '8'
          - '9'
          - '10'
      dependency_cache:
        description: Quality job dependency cache (runner image remains identical)
        required: true
        default: warm
        type: choice
        options: [warm, cold]
      refresh_screenshots:
        description: Capture and update documentation screenshots
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-runner-image:
    name: Prepare shared test runner image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.pinned-image.outputs.image }}
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Resolve runner image
        id: image
        env:
          E2E_RUNNER_REPOSITORY: ghcr.io/${{ github.repository_owner }}/nexus-terminal-e2e-runner
        run: |
          image="$E2E_RUNNER_REPOSITORY:latest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Using E2E runner image $image"

      - name: Distribute all test layers across runners
        id: matrix
        env:
          RUNNERS: ${{ github.event_name == 'workflow_dispatch' && inputs.test_runners || '8' }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const total = Number(process.env.RUNNERS);
          const include = Array.from({ length: total }, (_, index) => ({ shard: index + 1, shards: total }));
          appendFileSync(process.env.GITHUB_OUTPUT, `value=${JSON.stringify({ include })}\n`);
          JS

      - name: Check for runner image update
        id: check
        env:
          E2E_RUNNER_IMAGE: ${{ steps.image.outputs.image }}
          CAN_UPDATE_RUNNER_IMAGE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          expected="$(node scripts/e2e/runner-image-info.mjs fingerprint)"
          current="$(docker buildx imagetools inspect "$E2E_RUNNER_IMAGE" --format '{{range .Image.Config.Env}}{{println .}}{{end}}' 2>/dev/null | sed -n 's/^E2E_RUNNER_FINGERPRINT=//p' || true)"
          if [ "$current" = "$expected" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "E2E runner image metadata matches; skipping pull and build."
          elif [ "$CAN_UPDATE_RUNNER_IMAGE" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "The current test runner is unavailable for this fork; a matching runner must be published." >&2
            exit 1
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "E2E runner image is missing or outdated; building latest now."
          fi

      - name: Log in to GHCR
        if: steps.check.outputs.build == 'true'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push updated runner image
        if: steps.check.outputs.build == 'true'
        env:
          E2E_RUNNER_REPOSITORY: ghcr.io/${{ github.repository_owner }}/nexus-terminal-e2e-runner
        run: scripts/e2e/build-runner-image.sh

      - name: Pin the immutable runner image for every shard
        id: pinned-image
        env:
          RUNNER_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          digest="$(docker buildx imagetools inspect "$RUNNER_IMAGE" --format '{{json .Manifest}}' | node -e 'let s=""; for await (const c of process.stdin) s+=c; const d=JSON.parse(s).digest; if (!/^sha256:[a-f0-9]{64}$/.test(d)) throw Error("Invalid image digest"); process.stdout.write(d)' --input-type=module)"
          echo "image=${RUNNER_IMAGE%:*}@$digest" >> "$GITHUB_OUTPUT"
          echo "Pinned runner $RUNNER_IMAGE@$digest"

      - name: Record exact test environment
        env:
          PINNED_RUNNER_IMAGE: ${{ steps.pinned-image.outputs.image }}
        run: |
          mkdir -p tests/.artifacts/environment
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const fingerprint = execFileSync(process.execPath, ['scripts/e2e/runner-image-info.mjs', 'fingerprint'], { encoding: 'utf8' }).trim();
          fs.writeFileSync('tests/.artifacts/environment/environment.json', JSON.stringify({
            sha: process.env.GITHUB_SHA, image: process.env.PINNED_RUNNER_IMAGE, fingerprint,
          }, null, 2));
          JS

      - name: Upload immutable test environment
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-environment-${{ github.sha }}-${{ github.run_attempt }}
          path: tests/.artifacts/environment/environment.json
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Checks and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXUS_TEST_METRICS: ${{ github.workspace }}/tests/.artifacts/quality-metrics
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3.1.2
        with:
          node-version-file: .node-version
          cache: ${{ github.event_name != 'workflow_dispatch' || inputs.dependency_cache != 'cold' }}
          install: false

      - name: Install workspace dependencies
        run: bash scripts/e2e/measure-command.sh "$NEXUS_TEST_METRICS/install.json" pnpm install --frozen-lockfile

      - name: Restore content-based check caches
        id: check-cache
        if: github.event_name != 'workflow_dispatch' || inputs.dependency_cache != 'cold'
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .eslintcache
            node_modules/.cache/prettier/
            packages/frontend/node_modules/.cache/typecheck.tsbuildinfo
          key: quality-checks-${{ runner.os }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml', 'package.json', 'eslint.config.mjs', '.prettierrc', '.prettierignore', 'packages/frontend/package.json', 'packages/frontend/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            quality-checks-${{ runner.os }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml', 'package.json', 'eslint.config.mjs', '.prettierrc', '.prettierignore', 'packages/frontend/package.json', 'packages/frontend/tsconfig.json') }}-

      - name: Checkout plugin test owners
        uses: actions/checkout@v7.0.1
        with:
          repository: 0honus0/nexus-agent-plugins
          path: tests/.artifacts/plugin-source
          persist-credentials: false

      - name: Build application and sign plugin candidates once
        run: |
          echo "::group::Build host application"
          bash scripts/e2e/measure-command.sh "$NEXUS_TEST_METRICS/build.json" pnpm --filter @nexus-terminal/tests build
          node scripts/e2e/host-test-artifact.mjs write "$GITHUB_SHA"
          echo "::endgroup::"
          echo "::group::Build and sign plugin candidates"
          (
            cd tests/.artifacts/plugin-source
            bash "$GITHUB_WORKSPACE/scripts/e2e/measure-command.sh" "$NEXUS_TEST_METRICS/plugin-install.json" pnpm install --frozen-lockfile
            bash "$GITHUB_WORKSPACE/scripts/e2e/measure-command.sh" "$NEXUS_TEST_METRICS/plugin-build.json" pnpm build
            bash "$GITHUB_WORKSPACE/scripts/e2e/measure-command.sh" "$NEXUS_TEST_METRICS/plugin-sign.json" pnpm prepare:interop ../plugin-candidates
            git rev-parse HEAD > ../plugin-candidates/source.sha
            tar --exclude=node_modules --exclude=.git -czf ../plugin-test-source.tar.gz .
          )
          echo "::endgroup::"

      - name: Upload exact plugin source and candidates
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-plugin-candidates-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            tests/.artifacts/plugin-test-source.tar.gz
            tests/.artifacts/plugin-candidates/staging-1/
            tests/.artifacts/plugin-candidates/source.sha
          if-no-files-found: error
          retention-days: 14

      - name: Upload tested application build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-application-${{ github.sha }}-${{ github.run_attempt }}
          overwrite: true
          path: |
            packages/shared/dist/
            packages/backend/dist/
            packages/backend/dist-plugin-sdk/
            packages/frontend/dist/
            packages/host-test-artifact.json
          if-no-files-found: error
          retention-days: 14

      - name: Check host and plugin source, formatting and independent behavior
        env:
          NEXUS_TEST_PLUGIN_SOURCE_ROOT: ${{ github.workspace }}/tests/.artifacts/plugin-source
          NEXUS_TEST_HOST_ROOT: ${{ github.workspace }}
          NEXUS_TEST_PLUGIN_SET: ${{ github.workspace }}/tests/.artifacts/plugin-candidates/staging-1
        run: |
          echo "::group::Host checks and fast tests"
          bash scripts/e2e/measure-command.sh "$NEXUS_TEST_METRICS/check.json" pnpm run check
          NEXUS_TEST_ARTIFACT_DIR="$NEXUS_TEST_METRICS/fast" \
            bash scripts/e2e/measure-command.sh "$NEXUS_TEST_METRICS/fast.json" pnpm test:fast
          echo "::endgroup::"
          echo "::group::Full repository formatting"
          bash scripts/e2e/measure-command.sh "$NEXUS_TEST_METRICS/format.json" pnpm run format:all:check
          echo "::endgroup::"
          echo "::group::Plugin checks and independent tests"
          (
            cd tests/.artifacts/plugin-source
            export NEXUS_TEST_ARTIFACT_DIR="$GITHUB_WORKSPACE/tests/.artifacts/plugin-quality"
            bash "$GITHUB_WORKSPACE/scripts/e2e/measure-command.sh" "$NEXUS_TEST_METRICS/plugin-check.json" pnpm check
            bash "$GITHUB_WORKSPACE/scripts/e2e/measure-command.sh" "$NEXUS_TEST_METRICS/plugin-fast.json" pnpm test:fast
            bash "$GITHUB_WORKSPACE/scripts/e2e/measure-command.sh" "$NEXUS_TEST_METRICS/plugin-test.json" \
              node --test --test-reporter=spec --test-reporter=junit \
              --test-reporter-destination=stdout \
              --test-reporter-destination="$NEXUS_TEST_ARTIFACT_DIR/packages.xml" \
              'plugins/*/tests/**/*.native.test.mjs' 'tests/{repository,templates}/**/*.native.test.mjs'
            bash "$GITHUB_WORKSPACE/scripts/e2e/measure-command.sh" "$NEXUS_TEST_METRICS/plugin-browser-check.json" pnpm check:browser
          )
          echo "::endgroup::"

      - name: Upload quality reports and resource measurements
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: quality-reports-${{ github.run_attempt }}
          path: |
            tests/.artifacts/plugin-quality/
            tests/.artifacts/quality-metrics/
          if-no-files-found: error
          retention-days: 14

      - name: Save verified check caches
        if: success() && steps.check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .eslintcache
            node_modules/.cache/prettier/
            packages/frontend/node_modules/.cache/typecheck.tsbuildinfo
          key: quality-checks-${{ runner.os }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml', 'package.json', 'eslint.config.mjs', '.prettierrc', '.prettierignore', 'packages/frontend/package.json', 'packages/frontend/tsconfig.json') }}-${{ github.sha }}

  tests:
    name: Tests shard ${{ matrix.shard }}
    needs: [test-runner-image, quality]
    permissions:
      contents: read
      packages: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: ${{ needs.test-runner-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # Reap orphaned SSH children and inspect their real file handles.
      # Only the first shard owns private finite tmpfs and Docker fixtures.
      options: >-
        --init --ipc=host --cap-add=SYS_PTRACE
        ${{ matrix.shard == 1 && '--cap-add=SYS_ADMIN --security-opt=apparmor=unconfined' || '' }}
        ${{ matrix.shard == 1 && '--volume=/var/run/docker.sock:/var/run/docker.sock' || '' }}
    env:
      NEXUS_TEST_ARTIFACT_DIR: ${{ github.workspace }}/tests/.artifacts/layers
      NEXUS_AGENT_ACCEPTANCE_ROOT: ${{ github.workspace }}/tests/.artifacts/layers
      NEXUS_TEST_DOCKER_NATIVE: backend/remote/docker/protocol/docker.native.test.mjs
      NEXUS_TEST_FINITE_FS_NATIVE: backend/remote/sessions/suspend/storage/suspended-log-enospc.native.test.mjs
      NEXUS_TEST_HOST_ROOT: ${{ github.workspace }}
      NEXUS_TEST_PLUGIN_SOURCE_ROOT: ${{ github.workspace }}/tests/.artifacts/plugin-source
      NEXUS_TEST_PLUGIN_SET: ${{ github.workspace }}/tests/.artifacts/plugin-validation-artifact/plugin-candidates/staging-1
      NEXUS_E2E_PREBUILT: '1'
      E2E_CAPTURE_SCREENSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_screenshots && '1' || '0' }}
      E2E_SCREENSHOT_OUTPUT_DIR: ${{ github.workspace }}/tests/.artifacts/functional-screenshots
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-runner-image.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Resolve this run's application and plugin builds
        id: builds
        uses: actions/github-script@v9.0.0
        with:
          retries: 3
          script: |
            const { resolveBuildArtifact } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/e2e/resolve-build-artifact.mjs`);
            const source = { github, owner: context.repo.owner, repo: context.repo.repo, runId: context.runId, sha: context.sha };
            const [application, plugins] = await Promise.all([
              resolveBuildArtifact({ ...source, kind: 'application' }),
              resolveBuildArtifact({ ...source, kind: 'plugin-candidates' }),
            ]);
            core.setOutput('application', application);
            core.setOutput('plugins', plugins);

      - name: Download tested application build
        id: application-download
        uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.builds.outputs.application }}
          path: packages
          merge-multiple: true

      - name: Download exact plugin candidates
        uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.builds.outputs.plugins }}
          path: tests/.artifacts/plugin-validation-artifact
          merge-multiple: true

      - name: Link cached workspace and read pinned plugin revision
        id: plugin-source
        shell: bash
        run: |
          expected="$(node scripts/e2e/runner-image-info.mjs fingerprint)"
          test "${E2E_RUNNER_FINGERPRINT:-}" = "$expected"
          pnpm install --frozen-lockfile --offline
          revision="$(cat tests/.artifacts/plugin-validation-artifact/plugin-candidates/source.sha)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned plugin test owners
        uses: actions/checkout@v7.0.1
        with:
          repository: 0honus0/nexus-agent-plugins
          ref: ${{ steps.plugin-source.outputs.sha }}
          path: tests/.artifacts/plugin-source
          persist-credentials: false

      - name: Restore plugin builds without rebuilding
        working-directory: tests/.artifacts/plugin-source
        run: |
          # Container mounts can resolve the checkout alias to /__w. Git checks the canonical owner path.
          git config --global --add safe.directory "$(realpath "$GITHUB_WORKSPACE")"
          git config --global --add safe.directory "$(pwd -P)"
          tar -xzf ../plugin-validation-artifact/plugin-test-source.tar.gz
          pnpm install --frozen-lockfile --prefer-offline
          node "$GITHUB_WORKSPACE/scripts/e2e/host-test-artifact.mjs" verify "$GITHUB_SHA"

      - name: Run independent protocol and module-browser lanes
        if: ${{ !cancelled() && steps.application-download.outcome == 'success' }}
        shell: bash
        run: |
          bash scripts/e2e/measure-command.sh "$NEXUS_TEST_ARTIFACT_DIR/metrics/shard.json" \
            bash scripts/e2e/run-test-shard.sh "${{ matrix.shard }}" "${{ matrix.shards }}"

      - name: Record shard resource environment
        if: always()
        env:
          PINNED_RUNNER_IMAGE: ${{ needs.test-runner-image.outputs.image }}
          DEPENDENCY_CACHE: ${{ inputs.dependency_cache || 'warm' }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          const read = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim() : null;
          const root = process.env.NEXUS_TEST_ARTIFACT_DIR + '/metrics';
          fs.mkdirSync(root, { recursive: true });
          fs.writeFileSync(root + '/environment.json', JSON.stringify({
            sha: process.env.GITHUB_SHA, runnerImage: process.env.PINNED_RUNNER_IMAGE,
            fingerprint: process.env.E2E_RUNNER_FINGERPRINT, dependencyCache: process.env.DEPENDENCY_CACHE,
            node: process.version, cpus: os.availableParallelism(), memoryBytes: os.totalmem(),
            cgroupMemoryPeakBytes: read('/sys/fs/cgroup/memory.peak') ?? read('/sys/fs/cgroup/memory/memory.max_usage_in_bytes'),
            cgroupMemoryLimitBytes: read('/sys/fs/cgroup/memory.max'),
            cgroupCpuMax: read('/sys/fs/cgroup/cpu.max'),
          }, null, 2));
          JS

      - name: Upload timings, module and protocol reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-layers-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            tests/.artifacts/layers/metrics/*
            tests/.artifacts/layers/**/reports/*
            tests/.artifacts/layers/**/browser/report.json
            tests/.artifacts/layers/**/*combination.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload documentation screenshots
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.refresh_screenshots }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-screenshots-${{ matrix.shard }}-${{ github.run_attempt }}
          path: tests/.artifacts/functional-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            tests/.artifacts/shard-server.log
            tests/.artifacts/layers/
          if-no-files-found: ignore
          retention-days: 7

  finalize-reports:
    name: Finalize test reports
    needs: [quality, tests, docker-smoke]
    if: ${{ always() && needs.quality.result == 'success' && needs.tests.result == 'success' && needs.docker-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Resolve successful shard timing artifacts
        id: timings
        uses: actions/github-script@v9.0.0
        with:
          retries: 3
          result-encoding: string
          script: |
            const { resolveTimingArtifacts } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/e2e/resolve-timing-artifacts.mjs`);
            return await resolveTimingArtifacts({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              runId: context.runId,
            });

      - name: Download successful shard reports
        uses: actions/download-artifact@v8.0.2
        with:
          # Use the REST API instead of the internal ListArtifacts endpoint.
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.timings.outputs.result }}
          path: e2e-timings

      - name: Update duration estimates
        run: node scripts/e2e/update-duration-estimates.mjs --input e2e-timings

      - name: Upload proposed duration estimates
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-duration-estimates-${{ github.run_attempt }}
          path: scripts/e2e/duration-estimates.json
          retention-days: 14

      - name: Download E2E screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_screenshots && github.ref_type == 'branch'
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: e2e-screenshots-*-${{ github.run_attempt }}
          path: e2e-screenshots
          merge-multiple: true

      - name: Stage E2E documentation screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_screenshots && github.ref_type == 'branch'
        run: |
          mapfile -t screenshots < <(find e2e-screenshots -maxdepth 1 -type f -name '*.png' -printf '%f\n' | sort)
          if [ "${#screenshots[@]}" -eq 0 ]; then
            echo "No documentation screenshots were produced." >&2
            exit 1
          fi
          mkdir -p doc/imgs/e2e
          find doc/imgs/e2e -maxdepth 1 -type f -name '*.png' -delete
          for screenshot in "${screenshots[@]}"; do
            test -s "e2e-screenshots/$screenshot"
            signature="$(od -An -tx1 -N8 "e2e-screenshots/$screenshot" | tr -d ' \n')"
            test "$signature" = "89504e470d0a1a0a"
            cp "e2e-screenshots/$screenshot" "doc/imgs/e2e/$screenshot"
          done
          echo "Staged ${#screenshots[@]} E2E screenshots under doc/imgs/e2e."

      - name: Push updated timings and requested screenshots
        if: github.ref_type == 'branch' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.refresh_screenshots))
        env:
          TESTED_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$TARGET_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$TESTED_SHA" ]; then
            echo "origin/$TARGET_BRANCH advanced after this E2E run; skipping stale report update."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A scripts/e2e/duration-estimates.json doc/imgs/e2e
          if git diff --cached --quiet; then
            echo "Test reports are already current."
            exit 0
          fi
          git commit -m "ci(e2e): refresh timings and requested screenshots [skip ci]"
          git push origin "HEAD:$TARGET_BRANCH"

  docker-smoke:
    name: Docker deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Read image Node.js version
        id: node_version
        run: echo "value=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Build unified image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          build-args: NODE_VERSION=${{ steps.node_version.outputs.value }}
          pull: true
          push: false
          load: true
          tags: nexus-terminal:e2e-smoke
          cache-from: type=gha,scope=unified-e2e-smoke
          cache-to: type=gha,mode=max,scope=unified-e2e-smoke

      - name: Run deployment health smoke
        run: scripts/e2e/docker-deployment-smoke.sh nexus-terminal:e2e-smoke
