name: E2E

on:
  push:
    paths:
      - 'packages/**'
      - 'tests/e2e/**'
      - 'scripts/e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'tests/e2e/**'
      - 'scripts/e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project:
          - auth
          - http
          - agent
          - websocket
          - ui
          - ssh
          - mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @nexus-terminal/e2e exec playwright install --with-deps chromium

      - name: Run ${{ matrix.project }} E2E
        run: pnpm --filter @nexus-terminal/e2e exec playwright test --project="${{ matrix.project }}"

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            tests/e2e/logs/
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
