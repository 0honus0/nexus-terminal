name: E2E

on:
  push:
    paths:
      - 'packages/backend/**'
      - 'packages/frontend/**'
      - 'verification/e2e/**'
      - 'package.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'packages/backend/**'
      - 'packages/frontend/**'
      - 'verification/e2e/**'
      - 'package.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            packages/backend/package-lock.json
            packages/frontend/package-lock.json
            verification/e2e/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix packages/backend

      - name: Install frontend dependencies
        run: npm ci --prefix packages/frontend

      - name: Install E2E dependencies
        run: npm ci --prefix verification/e2e

      - name: Build backend
        run: npm run build --prefix packages/backend

      - name: Build frontend
        run: npm run build --prefix packages/frontend

      - name: Install Chromium and system dependencies
        working-directory: verification/e2e
        run: npx playwright install --with-deps chromium

      - name: Install remote archive command dependencies
        run: sudo apt-get update && sudo apt-get install -y zip unzip bzip2

      - name: Run HTTP, WebSocket, UI, SSH, SFTP, and Mobile E2E
        run: npm run test:e2e

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-logs
          path: verification/e2e/logs/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-report
          path: |
            verification/e2e/playwright-report/
            verification/e2e/test-results/
          if-no-files-found: ignore
