name: E2E

on:
  push:
    paths:
      - "packages/backend/**"
      - "packages/frontend/**"
      - "packages/remote-gateway/**"
      - "verification/e2e/**"
      - "package.json"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "packages/backend/**"
      - "packages/frontend/**"
      - "packages/remote-gateway/**"
      - "verification/e2e/**"
      - "package.json"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            packages/backend/package-lock.json
            packages/frontend/package-lock.json
            packages/remote-gateway/package-lock.json
            verification/e2e/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix packages/backend

      - name: Install frontend dependencies
        run: npm ci --prefix packages/frontend

      - name: Install remote gateway dependencies
        run: npm ci --prefix packages/remote-gateway

      - name: Install E2E dependencies
        run: npm ci --prefix verification/e2e

      - name: Build backend
        run: npm run build --prefix packages/backend

      - name: Build frontend
        run: npm run build --prefix packages/frontend

      - name: Build remote gateway
        run: npm run build --prefix packages/remote-gateway

      - name: Run production ingress WebAuthn E2E
        shell: bash
        env:
          NODE_ENV: test
          PORT: "3001"
          NEXUS_DATA_DIR: ${{ runner.temp }}/nexus-terminal-ingress-data
          SESSION_COOKIE_NAME: nexus.ingress.sid
          SESSION_SECRET: ingress-session-secret-do-not-use-outside-tests-0000000000000000000000
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          REMOTE_GATEWAY_SHARED_SECRET: ingress-remote-gateway-shared-secret-do-not-use-outside-tests
          RP_ID: ssh.honus.top
          RP_ORIGIN: https://ssh.honus.top,https://ssh.trui.de
        run: |
          set -euo pipefail

          backend_log="$RUNNER_TEMP/nexus-terminal-ingress-backend.log"
          ingress_container="nexus-terminal-ingress-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          node packages/backend/dist/index.js >"$backend_log" 2>&1 &
          backend_pid=$!

          cleanup() {
            docker rm -f "$ingress_container" >/dev/null 2>&1 || true
            kill "$backend_pid" >/dev/null 2>&1 || true
            wait "$backend_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          backend_ready=0
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:3001/api/v1/status >/dev/null; then
              backend_ready=1
              break
            fi
            if ! kill -0 "$backend_pid" >/dev/null 2>&1; then
              cat "$backend_log"
              exit 1
            fi
            sleep 1
          done

          if [[ "$backend_ready" -ne 1 ]]; then
            cat "$backend_log"
            exit 1
          fi

          docker run -d \
            --name "$ingress_container" \
            --add-host backend:host-gateway \
            -p 127.0.0.1:18112:80 \
            -v "$PWD/packages/frontend/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/packages/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine >/dev/null

          ingress_ready=0
          for _ in {1..60}; do
            if curl -fsS -H 'Host: ssh.honus.top' http://127.0.0.1:18112/.well-known/webauthn >/dev/null; then
              ingress_ready=1
              break
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' "$ingress_container" 2>/dev/null || true)" != "true" ]]; then
              docker logs "$ingress_container" || true
              cat "$backend_log"
              exit 1
            fi
            sleep 1
          done

          if [[ "$ingress_ready" -ne 1 ]]; then
            docker logs "$ingress_container" || true
            cat "$backend_log"
            exit 1
          fi

          if ! NEXUS_PRODUCTION_BASE_URL=http://127.0.0.1:18112 npm --prefix verification/e2e run test:ingress; then
            docker logs "$ingress_container" || true
            cat "$backend_log"
            exit 1
          fi

      - name: Install Chromium and system dependencies
        working-directory: verification/e2e
        run: npx playwright install --with-deps chromium

      - name: Install remote archive command dependencies
        run: sudo apt-get update && sudo apt-get install -y zip unzip bzip2

      - name: Run HTTP, WebSocket, UI, SSH, SFTP, and Mobile E2E
        run: npm run test:e2e

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-logs
          path: verification/e2e/logs/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-report
          path: |
            verification/e2e/playwright-report/
            verification/e2e/test-results/
          if-no-files-found: ignore
