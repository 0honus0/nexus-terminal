name: E2E

on:
  push:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - '.dockerignore'
      - 'scripts/docker/**'
      - 'packages/agent-runtime/**'
      - 'packages/backend/**'
      - 'packages/frontend/**'
      - 'test/e2e/**'
      - 'scripts/e2e/**'
      - 'scripts/check-test-policy.mjs'
      - 'scripts/build/build.sh'
      - 'package.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - '.dockerignore'
      - 'scripts/docker/**'
      - 'packages/agent-runtime/**'
      - 'packages/backend/**'
      - 'packages/frontend/**'
      - 'test/e2e/**'
      - 'scripts/e2e/**'
      - 'scripts/check-test-policy.mjs'
      - 'scripts/build/build.sh'
      - 'package.json'
      - '.github/workflows/e2e.yml'
  schedule:
    # Weekly latest test-environment check plus a full E2E run.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      workers:
        description: Parallel E2E group workers; leave blank to use groups/settings.json
        required: false
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_RUNNER_REPOSITORY: ghcr.io/${{ github.repository_owner }}/nexus-terminal-e2e-runner

jobs:
  environment:
    name: Update E2E environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.state.outputs.changed }}
      screenshots_requested: ${{ steps.state.outputs.screenshots_requested }}
      runner_image: ${{ steps.state.outputs.runner_image }}
      runner_rebuild: ${{ steps.state.outputs.runner_rebuild }}
      node_version: ${{ steps.state.outputs.node_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm and current Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false

      - name: Resolve latest stable E2E environment
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          can_update=false
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            can_update=true
          fi

          if [[ "$can_update" == "true" ]]; then
            pnpm run test:e2e:env:latest
          else
            latest="$RUNNER_TEMP/latest-e2e-environment.json"
            node scripts/e2e/resolve-latest-test-environment.mjs > "$latest"
            if ! cmp -s scripts/e2e/versions.json "$latest"; then
              echo "::notice::A newer E2E environment is available; only the default branch applies automatic environment updates."
              {
                echo "## Newer E2E environment available"
                echo
                echo "This run checks latest versions but does not rewrite a PR or non-default branch."
                echo
                echo '```json'
                cat "$latest"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          changed=false
          if [[ "$can_update" == "true" ]] && ! git diff --quiet; then
            changed=true
            git diff --binary > "$RUNNER_TEMP/e2e-environment.patch"
          fi

          screenshots_requested=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            screenshots_requested=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            before_sha="${{ github.event.before }}"
            if [[ -n "$before_sha" && ! "$before_sha" =~ ^0+$ ]] \
              && git diff -U0 "$before_sha" "$GITHUB_SHA" -- test/e2e/tests \
                | grep -E '^[+-].*captureFunctionalScreenshot\(' >/dev/null; then
              screenshots_requested=true
            fi
          fi

          node_version="$(node -p "require('./scripts/e2e/versions.json').node")"
          tag="$(node scripts/e2e/runner-image-info.mjs tag)"
          fingerprint="$(node scripts/e2e/runner-image-info.mjs fingerprint)"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          runner_repository="ghcr.io/${owner}/nexus-terminal-e2e-runner"
          runner_image="${runner_repository}:${tag}"
          fingerprint_image="${runner_repository}:fingerprint-${fingerprint}"

          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          manifest_config_digest() {
            docker manifest inspect "$1" 2>/dev/null | jq -r '.config.digest // empty'
          }

          runner_digest="$(manifest_config_digest "$runner_image" || true)"
          fingerprint_digest="$(manifest_config_digest "$fingerprint_image" || true)"
          runner_rebuild=false
          if [[ -z "$runner_digest" || -z "$fingerprint_digest" || "$runner_digest" != "$fingerprint_digest" ]]; then
            runner_rebuild=true
            echo "::notice::E2E runner image is missing or does not match the current runner fingerprint; it will be rebuilt before grouped E2E starts."
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "screenshots_requested=$screenshots_requested" >> "$GITHUB_OUTPUT"
          echo "node_version=$node_version" >> "$GITHUB_OUTPUT"
          echo "runner_image=$runner_image" >> "$GITHUB_OUTPUT"
          echo "runner_rebuild=$runner_rebuild" >> "$GITHUB_OUTPUT"

      - name: Validate synchronized environment
        if: steps.state.outputs.changed == 'true'
        run: |
          node --check scripts/e2e/resolve-latest-test-environment.mjs
          node --check scripts/e2e/sync-test-environment.mjs
          node --check scripts/e2e/runner-image-info.mjs
          bash -n scripts/e2e/build-runner-image.sh
          pnpm run test:e2e:groups:check
          git diff --check

      - name: Upload E2E environment patch
        if: steps.state.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-environment-patch
          path: ${{ runner.temp }}/e2e-environment.patch
          if-no-files-found: error
          retention-days: 1

  runner-image:
    name: Build E2E runner image
    needs: environment
    if: ${{ needs.environment.outputs.runner_rebuild == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download E2E environment patch
        if: needs.environment.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: e2e-environment-patch
          path: ${{ runner.temp }}/e2e-environment-patch

      - name: Apply E2E environment patch
        if: needs.environment.outputs.changed == 'true'
        shell: bash
        run: git apply --binary "$RUNNER_TEMP/e2e-environment-patch/e2e-environment.patch"

      - name: Set up pnpm and target Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ needs.environment.outputs.node_version }}
          install: false

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build, smoke-check, and push E2E runner image
        run: scripts/e2e/build-runner-image.sh --push --image "$E2E_RUNNER_REPOSITORY"

  prepare:
    needs: [environment, runner-image]
    if: ${{ always() && needs.environment.result == 'success' && (needs.runner-image.result == 'success' || needs.runner-image.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.groups.outputs.workers }}
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download E2E environment patch
        if: needs.environment.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: e2e-environment-patch
          path: ${{ runner.temp }}/e2e-environment-patch

      - name: Apply E2E environment patch
        if: needs.environment.outputs.changed == 'true'
        shell: bash
        run: git apply --binary "$RUNNER_TEMP/e2e-environment-patch/e2e-environment.patch"

      - name: Set up pnpm and target Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ needs.environment.outputs.node_version }}
          install: false

      - name: Enforce package-manager architecture
        run: pnpm run check:package-management

      - name: Enforce E2E-only test policy
        run: pnpm run check:test-policy

      - name: Resolve and validate E2E groups
        id: groups
        shell: bash
        env:
          REQUESTED_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.workers || '' }}
        run: |
          set -euo pipefail
          workers="$REQUESTED_WORKERS"
          if [[ -z "$workers" ]]; then
            workers="$(node -p "require('./test/e2e/groups/settings.json').workers")"
          fi

          node test/e2e/support/groups.mjs generate --workers "$workers"
          node test/e2e/support/groups.mjs check --workers "$workers"
          matrix="$(node test/e2e/support/groups.mjs matrix --workers "$workers")"

          echo "workers=$workers" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-image:
    name: Docker deployment smoke
    needs: [environment, runner-image]
    if: ${{ always() && needs.environment.result == 'success' && (needs.runner-image.result == 'success' || needs.runner-image.result == 'skipped') }}
    runs-on: ubuntu-latest
    # First-run Tool Store materialization verifies six real Node/Python/Go packs.
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download E2E environment patch
        if: needs.environment.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: e2e-environment-patch
          path: ${{ runner.temp }}/e2e-environment-patch

      - name: Apply E2E environment patch
        if: needs.environment.outputs.changed == 'true'
        shell: bash
        run: git apply --binary "$RUNNER_TEMP/e2e-environment-patch/e2e-environment.patch"

      - name: Set up pnpm and target Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ needs.environment.outputs.node_version }}
          cache: true
          install: false

      - name: Install Docker smoke workspace dependencies
        run: >-
          pnpm install --frozen-lockfile
          --filter @nexus-terminal/e2e
          --filter @nexus-terminal/agent-runtime

      - name: Verify Agent sandbox prerequisite pin
        run: pnpm run check:sandbox-prerequisites --verify-latest

      - name: Install host Runner sandbox dependency
        run: ./scripts/agent-runtime/prepare-ubuntu-host.sh

      - name: Build host Agent Runner
        run: pnpm run build:agent-runtime

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build unified image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: nexus-terminal:e2e-smoke
          cache-from: type=gha,scope=unified-image
          cache-to: type=gha,mode=max,scope=unified-image

      - name: Run Docker deployment smoke
        run: scripts/e2e/docker-deployment-smoke.sh nexus-terminal:e2e-smoke

  playwright-groups:
    needs: [environment, runner-image, prepare]
    if: ${{ always() && needs.environment.result == 'success' && needs.prepare.result == 'success' && (needs.runner-image.result == 'success' || needs.runner-image.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.environment.outputs.runner_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      E2E_GROUP_WORKERS: ${{ needs.prepare.outputs.workers }}
      E2E_CAPTURE_SCREENSHOTS: ${{ (needs.environment.outputs.screenshots_requested == 'true' || needs.environment.outputs.changed == 'true') && '1' || '0' }}
      E2E_SCREENSHOT_OUTPUT_DIR: .tmp/functional-screenshots
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download E2E environment patch
        if: needs.environment.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: e2e-environment-patch
          path: ${{ runner.temp }}/e2e-environment-patch

      - name: Apply E2E environment patch
        if: needs.environment.outputs.changed == 'true'
        shell: bash
        run: git apply --binary "$RUNNER_TEMP/e2e-environment-patch/e2e-environment.patch"

      - name: Install E2E workspace dependencies
        run: >-
          pnpm install --frozen-lockfile
          --filter @nexus-terminal/backend
          --filter @nexus-terminal/frontend
          --filter @nexus-terminal/e2e

      - name: Verify preinstalled Playwright runtime
        run: |
          node --version
          pnpm --filter @nexus-terminal/e2e exec playwright --version
          test -d "$PLAYWRIGHT_BROWSERS_PATH"
          command -v zip
          command -v unzip
          command -v bzip2

      - name: Generate deterministic group configuration
        run: |
          node test/e2e/support/groups.mjs generate --workers "$E2E_GROUP_WORKERS"
          node test/e2e/support/groups.mjs check --workers "$E2E_GROUP_WORKERS"

      - name: Run E2E group ${{ matrix.group }} of ${{ needs.prepare.outputs.workers }}
        id: e2e
        timeout-minutes: 16
        run: node test/e2e/support/groups.mjs run --workers "$E2E_GROUP_WORKERS" --group "${{ matrix.group }}"

      - name: Upload inline functional screenshots
        if: ${{ always() && env.E2E_CAPTURE_SCREENSHOTS == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: functional-screenshots-group-${{ matrix.group }}
          path: test/e2e/.tmp/functional-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload group timings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timings-group-${{ matrix.group }}
          path: test/e2e/.tmp/spec-timings-group-${{ matrix.group }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload E2E logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-logs-group-${{ matrix.group }}
          path: test/e2e/logs/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: ${{ always() && steps.e2e.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-report-group-${{ matrix.group }}
          path: |
            test/e2e/playwright-report/
            test/e2e/test-results/
          if-no-files-found: ignore

  screenshots-commit:
    name: Commit functional screenshots
    needs: [environment, playwright-groups]
    if: ${{ always() && (needs.environment.outputs.screenshots_requested == 'true' || needs.environment.outputs.changed == 'true') && needs.environment.result == 'success' && needs.playwright-groups.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout tested product SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download E2E environment patch
        if: needs.environment.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: e2e-environment-patch
          path: ${{ runner.temp }}/e2e-environment-patch

      - name: Apply E2E environment patch
        if: needs.environment.outputs.changed == 'true'
        shell: bash
        run: git apply --binary "$RUNNER_TEMP/e2e-environment-patch/e2e-environment.patch"

      - name: Download inline functional screenshots
        uses: actions/download-artifact@v8
        with:
          pattern: functional-screenshots-group-*
          path: test/e2e/.tmp/functional-screenshots-merged
          merge-multiple: true

      - name: Verify functional screenshots
        shell: bash
        run: |
          set -euo pipefail
          node test/e2e/support/verify-functional-screenshots.mjs \
            test/e2e/.tmp/functional-screenshots-merged \
            "$RUNNER_TEMP/functional-screenshot-verification.json" \
            doc/imgs/e2e

      - name: Upload functional screenshot verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: functional-screenshot-verification-${{ github.sha }}
          path: ${{ runner.temp }}/functional-screenshot-verification.json
          if-no-files-found: error
          retention-days: 14

      - name: Stage functional screenshots
        shell: bash
        run: |
          set -euo pipefail
          screenshot_root="test/e2e/.tmp/functional-screenshots-merged"
          mapfile -t screenshots < <(find "$screenshot_root" -maxdepth 1 -type f -name '*.png' -printf '%f\n' | sort)
          if (( ${#screenshots[@]} == 0 )); then
            echo "::error::Screenshot capture was requested but the E2E run produced no functional screenshots."
            exit 1
          fi

          mkdir -p doc/imgs/e2e
          find doc/imgs/e2e -maxdepth 1 -type f -name '*.png' -delete
          for screenshot in "${screenshots[@]}"; do
            cp "$screenshot_root/$screenshot" "doc/imgs/e2e/$screenshot"
          done

          {
            echo "## Functional screenshots"
            echo
            echo "Collected ${#screenshots[@]} screenshot checkpoints from this E2E run:"
            echo
            for screenshot in "${screenshots[@]}"; do
              echo "- \`$screenshot\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit environment and screenshot refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git add -f doc/imgs/e2e/*.png
          if git diff --cached --quiet; then
            echo "E2E environment and functional screenshots are already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "chore(e2e): refresh test environment and screenshots [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

  rebalance:
    needs: [environment, runner-image, prepare, playwright-groups, screenshots-commit]
    if: ${{ always() && github.event_name != 'pull_request' && needs.environment.result == 'success' && (needs.runner-image.result == 'success' || needs.runner-image.result == 'skipped') && needs.prepare.result == 'success' && needs.playwright-groups.result == 'success' && (needs.screenshots-commit.result == 'success' || needs.screenshots-commit.result == 'skipped') }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download timing artifacts through the Actions API
        id: timings
        shell: bash
        run: |
          set -euo pipefail
          echo "available=false" >> "$GITHUB_OUTPUT"
          artifact_root="test/e2e/.tmp/timing-artifacts"
          mkdir -p "$artifact_root"

          response="$RUNNER_TEMP/e2e-artifacts.json"
          if ! curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > "$response"; then
            echo "::warning::Timing artifacts could not be listed; skipping this run's optional E2E rebalance."
            exit 0
          fi

          mapfile -t artifacts < <(jq -r '.artifacts[] | select(.name | startswith("e2e-timings-group-")) | [.id, .name] | @tsv' "$response")
          if [[ "${#artifacts[@]}" -ne "${{ needs.prepare.outputs.workers }}" ]]; then
            echo "::warning::Expected ${{ needs.prepare.outputs.workers }} timing artifacts, found ${#artifacts[@]}; skipping this run's optional E2E rebalance."
            exit 0
          fi

          for artifact in "${artifacts[@]}"; do
            IFS=$'\t' read -r artifact_id artifact_name <<< "$artifact"
            zip_path="$RUNNER_TEMP/${artifact_name}.zip"
            target="$artifact_root/$artifact_name"
            mkdir -p "$target"
            if ! curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$zip_path"; then
              echo "::warning::Timing artifact $artifact_name could not be downloaded; skipping this run's optional E2E rebalance."
              exit 0
            fi
            if ! unzip -q "$zip_path" -d "$target"; then
              echo "::warning::Timing artifact $artifact_name could not be unpacked; skipping this run's optional E2E rebalance."
              exit 0
            fi
          done
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Update timing history and rebalance default groups
        if: steps.timings.outputs.available == 'true'
        run: |
          node test/e2e/support/groups.mjs update-timings --input-dir test/e2e/.tmp/timing-artifacts
          node test/e2e/support/groups.mjs generate
          node test/e2e/support/groups.mjs check

      - name: Commit refreshed E2E group balance
        if: steps.timings.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ':(glob)test/e2e/groups/group-*.json'; then
            echo "E2E group assignment is unchanged; timing-only updates will not create a commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/e2e/groups
          git commit -m "chore(e2e): rebalance test groups [skip ci]"
          if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "::warning::E2E timing refresh could not be pushed; a newer branch update may have won the race."
          fi
