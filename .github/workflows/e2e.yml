name: E2E

on:
  push:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - '.dockerignore'
      - 'packages/**'
      - 'tests/**'
      - 'scripts/e2e/**'
      - 'scripts/docker/**'
      - 'scripts/agent-runner/**'
      - 'scripts/checks/**'
      - 'scripts/format/**'
      - 'scripts/build/build.sh'
      - '.prettierignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/publish-ghcr.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - '.dockerignore'
      - 'packages/**'
      - 'tests/**'
      - 'scripts/e2e/**'
      - 'scripts/docker/**'
      - 'scripts/agent-runner/**'
      - 'scripts/checks/**'
      - 'scripts/format/**'
      - 'scripts/build/build.sh'
      - '.prettierignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/publish-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Checks, format, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run standard checks serially
        run: pnpm run check

      - name: Check formatting
        run: pnpm run format:all:check

      - name: Build production packages
        run: |
          pnpm run build
          pnpm run build:agent-runner

  playwright:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project:
          - auth
          - http
          - agent
          - websocket
          - ui
          - ssh
          - mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @nexus-terminal/e2e exec playwright install --with-deps chromium

      - name: Run ${{ matrix.project }} E2E
        run: pnpm --filter @nexus-terminal/e2e exec playwright test --project="${{ matrix.project }}"

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            tests/e2e/logs/
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker-smoke:
    name: Docker deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install smoke-test dependencies
        run: >-
          pnpm install --frozen-lockfile
          --filter @nexus-terminal/e2e
          --filter @nexus-terminal/agent-runner

      - name: Install Chromium
        run: pnpm --filter @nexus-terminal/e2e exec playwright install --with-deps chromium

      - name: Install host Runner prerequisites
        run: ./scripts/agent-runner/prepare-ubuntu-host.sh

      - name: Build host Agent Runner
        run: pnpm run build:agent-runner

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build unified image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: nexus-terminal:e2e-smoke

      - name: Build standalone Agent Runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/docker/agent-runner/Dockerfile
          push: false
          load: true
          tags: nexus-agent-runner:e2e-smoke
          cache-from: type=gha,scope=agent-runner-image
          cache-to: type=gha,mode=max,scope=agent-runner-image

      - name: Run standalone Agent Runner smoke
        run: scripts/e2e/standalone-runner-image-smoke.sh nexus-agent-runner:e2e-smoke

      - name: Run core no-Runner smoke
        run: scripts/e2e/docker-core-no-runner-smoke.sh nexus-terminal:e2e-smoke

      - name: Run full Docker deployment smoke
        run: scripts/e2e/docker-deployment-smoke.sh nexus-terminal:e2e-smoke
