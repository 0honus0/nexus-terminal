name: M17 Static Disposition

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact product commit to audit
        required: true
        default: b8d5f31e53e8c5d59088238838456f8628238f7b
        type: string
  workflow_call:
    inputs:
      target_sha:
        description: Exact product commit to audit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: m17-static-disposition-${{ inputs.target_sha }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ inputs.target_sha }}

jobs:
  static:
    name: Static gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Verify checked-out SHA
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          printf 'target_sha=%s\nchecked_out_sha=%s\n' "$TARGET_SHA" "$checked_out_sha"
          test "$checked_out_sha" = "$TARGET_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/frontend/package-lock.json

      - name: Install root and frontend dependencies
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix packages/frontend

      - name: Run static gate matrix
        id: gates
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail

          report="$RUNNER_TEMP/m17-static-gates.tsv"
          : > "$report"
          failed=0

          run_gate() {
            local name="$1"
            shift
            printf '\n===== %s =====\n' "$name"
            set +e
            "$@"
            local exit_code=$?
            set -e
            printf '%s\t%s\n' "$name" "$exit_code" | tee -a "$report"
            if [[ "$exit_code" -ne 0 ]]; then failed=1; fi
          }

          run_gate check:architecture npm --prefix packages/frontend run check:architecture
          run_gate check:i18n npm --prefix packages/frontend run check:i18n
          run_gate vue-tsc bash -c 'cd packages/frontend && npx --no-install vue-tsc --noEmit'
          run_gate vite-build bash -c 'cd packages/frontend && npx --no-install vite build'
          run_gate git-diff-check git diff --check
          run_gate check:test-policy npm run check:test-policy
          run_gate groups:check npm --prefix test/e2e run groups:check --
          run_gate format:all:check npm run format:all:check

          {
            echo '### M17 static gate exit codes'
            echo
            echo '| Gate | Exit |'
            echo '| --- | ---: |'
            awk -F '\t' '{ printf "| `%s` | `%s` |\n", $1, $2 }' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$failed"

      - name: Upload static gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m17-static-gates-${{ inputs.target_sha }}
          path: ${{ runner.temp }}/m17-static-gates.tsv
          if-no-files-found: error
          retention-days: 14

      - name: Generate scoped format patch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install prettier --write \
            doc/FRONTEND_UI_RESTORATION_PLAN.md \
            packages/frontend/src/foundation/ui/OverlayPanel.vue \
            test/e2e/groups/group-6.json \
            test/e2e/groups/timings.json
          git diff --binary -- \
            doc/FRONTEND_UI_RESTORATION_PLAN.md \
            packages/frontend/src/foundation/ui/OverlayPanel.vue \
            test/e2e/groups/group-6.json \
            test/e2e/groups/timings.json > "$RUNNER_TEMP/m17-format.patch"

      - name: Upload scoped format patch
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m17-format-patch-${{ inputs.target_sha }}
          path: ${{ runner.temp }}/m17-format.patch
          if-no-files-found: error
          retention-days: 14

      - name: Fail if any static gate failed
        if: always() && steps.gates.outcome == 'failure'
        run: exit 1
