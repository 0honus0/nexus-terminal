x-nexus-service: &nexus-service
  image: ${NEXUS_IMAGE_REPOSITORY:-ghcr.io/0honus0/nexus-terminal}:${NEXUS_IMAGE_TAG:-latest}
  restart: unless-stopped
  networks:
    - nexus-terminal-network

services:
  frontend:
    <<: *nexus-service
    command: ['frontend']
    container_name: nexus-terminal-frontend
    networks:
      nexus-terminal-network:
        ipv4_address: ${NEXUS_FRONTEND_PROXY_IP:-172.30.0.2}
        ipv6_address: ${NEXUS_FRONTEND_PROXY_IPV6:-fd01::2}
    ports:
      - '${NEXUS_HTTP_PORT:-18111}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    <<: *nexus-service
    command: ['backend']
    container_name: nexus-terminal-backend
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:-loopback},${NEXUS_FRONTEND_PROXY_IP:-172.30.0.2},${NEXUS_FRONTEND_PROXY_IPV6:-fd01::2}
      PORT: 3001
      APP_NAME: ${APP_NAME:-Nexus Terminal}
      GUACD_HOST: guacd
      GUACD_PORT: 4822
      RP_ID: ${RP_ID:-}
      RP_ORIGIN: ${RP_ORIGIN:-}
      NEXUS_PUBLIC_ORIGIN: ${NEXUS_PUBLIC_ORIGIN:-http://localhost:18111}
      # Plugin/SDK 与 API/WebSocket 复用 Backend 3001 listener；不再需要独立 Plugin 端口配置。
      # 默认 nexus.agent（Operations + Developer Skills）以及 nexus.fullstack 等 first-party App 都是独立签名 Plugin，不编译进 Nexus 主镜像。
      # 这里只允许替换官方 catalog/mirror 地址；Publisher 信任根由 Nexus Host 固定 pin。
      NEXUS_AGENT_OFFICIAL_PLUGIN_CATALOG_URL: ${NEXUS_AGENT_OFFICIAL_PLUGIN_CATALOG_URL:-https://github.com/0honus0/nexus-agent-plugins/releases/latest/download/catalog.json}
      # Runner is an optional enhancement. Leave URL empty for the core-only stack.
      NEXUS_AGENT_RUNNER_URL: ${NEXUS_AGENT_RUNNER_URL:-}
      NEXUS_AGENT_RUNNER_TOKEN: ${NEXUS_AGENT_RUNNER_TOKEN:-}
    volumes:
      - ./data:/app/data
    depends_on:
      guacd:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:$${PORT:-3001}/api/v1/status']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  guacd:
    image: ${GUACD_IMAGE:-guacamole/guacd:latest}
    container_name: nexus-terminal-guacd
    restart: unless-stopped
    networks:
      - nexus-terminal-network

  agent-runner:
    image: ${NEXUS_AGENT_RUNNER_IMAGE_REPOSITORY:-ghcr.io/0honus0/nexus-agent-runner}:${NEXUS_AGENT_RUNNER_IMAGE_TAG:-latest}
    container_name: nexus-agent-runner
    restart: unless-stopped
    profiles: ['runner']
    networks:
      - nexus-terminal-network
    env_file:
      - path: .env
        required: false
    environment:
      NEXUS_AGENT_RUNNER_TOKEN: ${NEXUS_AGENT_RUNNER_TOKEN:-}
    volumes:
      - ${NEXUS_AGENT_RUNNER_DATA_DIR:-./agent-runner-data}:/var/lib/nexus-agent-runner
      - ./data/agent/plugins:/var/lib/nexus-agent-runner/plugin-source:ro

networks:
  nexus-terminal-network:
    driver: bridge
    name: nexus-terminal-network
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${NEXUS_IPV4_SUBNET:-172.30.0.0/24}
        - subnet: ${NEXUS_IPV6_SUBNET:-fd01::/80}
          gateway: ${NEXUS_IPV6_GATEWAY:-fd01::1}
