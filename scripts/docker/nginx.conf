pid /tmp/nexus-nginx.pid;
error_log stderr warn;

events {}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	access_log off;
	client_body_temp_path /tmp/nexus-nginx-body;
	proxy_temp_path /tmp/nexus-nginx-proxy;
	fastcgi_temp_path /tmp/nexus-nginx-fastcgi;
	uwsgi_temp_path /tmp/nexus-nginx-uwsgi;
	scgi_temp_path /tmp/nexus-nginx-scgi;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	# HTTPS may terminate at an outer proxy. Only the original request authority can be forwarded.
	map "$http_origin|$http_host" $backend_origin {
		default 'null';
		~^[|] '';
		~^https?://([^|/]+)[|]\1$ http://127.0.0.1:9999;
	}

	server {
		listen 8080;
		root /app/frontend;

		location /api/ {
			# Stream sizes and admission are enforced by the app and its registered routes.
			client_max_body_size 0;
			proxy_pass http://127.0.0.1:9999;
			proxy_http_version 1.1;
			proxy_set_header Host 127.0.0.1:9999;
			proxy_set_header Origin $backend_origin;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_request_buffering off;
			proxy_buffering off;
			proxy_read_timeout 3600s;
		}

		location /assets/ {
			try_files $uri =404;
		}

		location / {
			try_files $uri /index.html;
		}
	}
}
